server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/kumwe/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    client_max_body_size 8m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Extension assets stay behind live registry/trust enforcement so emergency
    # revocation cannot leave previously published bytes directly reachable.
    location ^~ /assets/extensions/ {
        try_files __kumwe_trusted_extension_asset__ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kumwe/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
