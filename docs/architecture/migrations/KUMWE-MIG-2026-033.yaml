di_changes:
  - service: Kumwe\Extension\Toolchain\ComponentScaffolder
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Explicit App composition, rebound: the SDK service map declares no provider, factory or alias, and the scaffolder now takes the container canonical encoder (Kumwe\\CanonicalJson\\CanonicalEncoder, bound to the native encoder by NativeComputationFactory) as its first constructor argument."
  - service: Kumwe\Extension\Toolchain\PackageInspector
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Explicit App composition, rebound with the container canonical encoder; the same inspector instance serves the author toolchain and the admission path, which is the shared-inspector invariant of the SDK app agreement."
  - service: Kumwe\Extension\Toolchain\DeterministicPackageBuilder
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Explicit App composition, rebound with the container canonical encoder and the shared PackageInspector."
  - service: Kumwe\Extension\Package\PackageEvidenceInspector
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Explicit App composition kept unchanged, together with ZipArchiveContentReader, PackageCodeConformance, PackageAdmissionPolicy, SodiumPublicKeyPackageSignatureVerifier, ProtectedSigningKeyReader, PackageSigner and StaticConformanceRunner, whose 0.3.3 signatures are the 0.2.4 ones."
  - service: Kumwe\App\Extension\Infrastructure\DoctrineExtensionManager
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host adapter now constructed with the canonical encoder, which ExtensionManifest::fromJson, CanonicalManifestInterpreter::fromManifest and ExtensionContributionSummary::project require in 0.3.3."
  - service: Kumwe\App\Extension\Runtime\ExtensionRuntimeMapCompiler
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host adapter now constructed with the canonical encoder for ExtensionManifest::fromJson; ExtensionRuntimeLoader, TrustStore and BusinessSecurityPortalMigration gain the same leading or trailing dependency for the same reason."
  - service: Kumwe\App\Extension\Contribution\ExtensionContributionRegistrySet
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host registry set now constructed with the canonical encoder, which it hands to CoreExtensionContributions, the EventContractRegistry it validates, the manifest interpreter and the owned binding registrar; the set exposes it through canonicalEncoder()."
  - service: Kumwe\App\Extension\Application\OpenApi\OpenApiExtensionActivationAdmission
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host admission now constructed with the canonical encoder as its first argument for the manifest interpretation it performs."
  - service: Kumwe\Extension\Support\CanonicalJson
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Removed by the SDK; nothing was bound to it and the App never referenced it. The container keeps exposing Kumwe\\CanonicalJson\\CanonicalEncoder to extensions."
