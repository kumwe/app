di_changes:
  - service: Kumwe\Audit\Application\AuditRecorder
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package recorder port to DoctrineAuditRecorder, which now receives the container's Kumwe\\CanonicalJson\\CanonicalEncoder for every event digest; the package ships no provider."
  - service: Kumwe\Audit\Application\AuditArchiveStorage
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package archive-storage port to FilesystemAuditArchiveStorage, whose keys and lowercase SHA-256 checksums satisfy the package StoredAuditArchive validation."
  - service: Kumwe\Audit\Application\AuditTrailVerifier
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package verifier port to DoctrineAuditTrailVerifier, which now receives the container's CanonicalEncoder to recompute event and anchor digests; finding codes and report counters stay within the package bounds."
  - service: Kumwe\Audit\Application\AuditTrailExporter
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package exporter port to DoctrineAuditTrailExporter; it refuses empty and inverted ranges before constructing the package AuditTrailExport. The App-owned AuditAnchorWriter and AuditRetentionService ports and the tamper-evidence migration also receive the container's CanonicalEncoder."
