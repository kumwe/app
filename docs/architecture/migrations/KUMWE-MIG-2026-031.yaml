di_changes:
  - service: Kumwe\Conversion\Provider\MoneyRateProviderCatalog
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host shares the package catalog port as RuntimeMoneyRateProviderCatalog over the contribution registry set and the extension execution gate, so only trusted, activated rate providers are reachable; the package ships no provider and its service map owns no service."
  - service: Kumwe\Conversion\Provider\MoneyConversionPipeline
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host constructs the package pipeline directly from the shared MoneyConverter and MoneyRateProviderCatalog, the direct construction mode the service map prescribes; no factory, alias or provider is registered."
  - service: Kumwe\Conversion\Provider\UnitConversionProviderCatalog
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host shares the package catalog port as RuntimeUnitConversionProviderCatalog over the same registry set and execution gate; core ships no conversion table, so the catalog stays empty until a package that owns one is installed."
  - service: Kumwe\Conversion\Provider\UnitConversionPipeline
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host constructs the package pipeline directly from the shared QuantityConverter and UnitConversionProviderCatalog, mirroring the money pipeline."
