di_changes:
  - service: Kumwe\Access\AuthorizationPolicyRegistry
    factory: Kumwe\Access\Container\AuthorizationPolicyRegistryFactory
    note: "Package factory installed through Kumwe\\Access\\ConfigProvider; it builds the shared registry from kumwe.access.membership_resource_types, the seven membership-sensitive types HostAccessPolicy states, replacing the App registry the kernel constructed and shared itself."
  - service: Kumwe\Access\ResourceOwnershipScopePolicy
    factory: Kumwe\Access\Container\ResourceOwnershipScopePolicyFactory
    note: "Package factory installed through the same provider; it builds the shared policy from kumwe.access.reserved_ownership_rules, the forty-four reserved categories HostAccessPolicy states as wire values, replacing the App policy whose table was a class constant."
  - service: Kumwe\Access\CompositeResourceOwnershipReferences
    factory: Kumwe\Access\Container\CompositeResourceOwnershipReferencesFactory
    note: "Package factory installed through the same provider; it resolves kumwe.access.reference_inspectors, which names the shared DoctrineGrantScopeOwnershipReferences service the host now registers, and the host aliases the package ResourceOwnershipReferences port to it because the package installs no alias."
  - service: Kumwe\Access\ResourceOwnershipReferences
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host alias of the package port to the package composite, replacing the inline App composite the kernel built around the Doctrine grant-scope inspector."
  - service: Kumwe\Access\AuthorizationGateway
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package gateway port to DenyByDefaultAuthorizationGateway, which now returns four-state decisions, converts SystemIdentity to its neutral code before the package policy allowlist, and records through the App StructuredLogAuthorizationDecisionRecorder implementing the package recorder port."
  - service: Kumwe\Access\ResourceSiteOwnership
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package ownership-reader port to DoctrineResourceSiteOwnership."
  - service: Kumwe\Access\ResourceSiteOwnershipWriter
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package ownership-writer port to DoctrineResourceSiteOwnershipWriter."
  - service: Kumwe\Access\SiteGroupRegistry
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host aliases the package site-group registry port to DoctrineSiteGroupRegistry."
  - service: Kumwe\Access\SiteGroupWriter
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package site-group writer port to DoctrineSiteGroupWriter."
  - service: Kumwe\Access\MembershipDirectory
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package membership directory port to DoctrineMembershipDirectory; the App interface of the same shape is removed and its twenty-two consumers read the package port."
  - service: Kumwe\Access\MembershipContextValidator
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host aliases the package membership freshness port to the package MembershipDirectory binding, so the gateway revalidates memberships against live storage."
