di_changes:
  - service: Kumwe\Idempotency\IdempotencyLedger
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package ledger port to DoctrineIdempotencyLedger over the shared idempotency table with the container clock, consumed by PersistentIdempotencyMiddleware; the package ships no provider (service map config_provider null)."
  - service: Kumwe\Idempotency\SecretOnceIdempotencyLedger
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package secret-once ledger port to DoctrineSecretOnceIdempotencyLedger, consumed by SecretOnceIdempotencyMiddleware; no package provider."
  - service: Kumwe\Idempotency\IdempotencyPurger
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package purge port to DoctrineIdempotencyPurger, consumed by PurgeIdempotencyRecordsHandler under the maintenance principal; no package provider. No CanonicalEncoder binding is added because no App production code constructs the package IdempotencyRecord or IdempotencyResult."
