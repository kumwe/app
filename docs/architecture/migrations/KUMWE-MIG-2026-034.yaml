di_changes:
  - service: Kumwe\Content\Application\ContentRepository
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host re-keys the shared DoctrineContentRepository from the removed App port to the package port; the adapter already implements the adopt() method the 0.2.0 port requires, and ContentService resolves the same instance for its ContentSearchRepository and SiteScopedContentRepository parameters as before. The package ships no provider."
  - service: Kumwe\Content\Application\TranslationGroupRepository
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host re-keys the shared DoctrineTranslationGroupRepository from the removed App port to the package port."
  - service: Kumwe\Content\Application\ContentModelRepository
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host re-keys the shared DoctrineContentModelRepository from the removed App port to the package port; ContentModelService, ContentService, the Studio authoring authority and the content-model delivery handlers resolve it by the package name."
  - service: Kumwe\Content\Domain\JsonSchemaValidator
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host re-keys the shared stateless validator instance from the removed App class to the package class, which now snapshots the schema and value it validates; ContentModelService, ContentService, the Studio projector and the content-type migration resolve it by the package name."
  - service: Kumwe\Content\Domain\SchemaCompatibilityChecker
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host re-keys the shared stateless checker instance from the removed App class to the package class; ContentModelService resolves it by the package name."
  - service: Kumwe\Content\Workflow\Domain\Workflow
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host re-keys the shared built-in lifecycle instance from the removed App class to the package class; ContentService resolves it by the package name."
