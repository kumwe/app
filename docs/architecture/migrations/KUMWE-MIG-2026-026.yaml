di_changes:
  - service: Kumwe\Automation\CryptographicJitterSource
    factory: Kumwe\Automation\Container\CryptographicJitterSourceFactory
    note: "Package factory installed through Kumwe\\Automation\\ConfigProvider; the kernel admits only the two container factories the package exports (this one and RetryPolicyFactory) and the provider aliases, because the provider documents them as bare class names. The host share of the App CryptographicJitterSource under the App JitterSource port is removed."
  - service: Kumwe\Automation\RetryPolicy
    factory: Kumwe\Automation\Container\RetryPolicyFactory
    note: "Package factory installed through the same provider; it reads the clock the kernel binds and the kumwe.automation base_delay_seconds 1 and maximum_delay_seconds 300 the config service now carries, which are the delays the removed host closure passed by hand."
  - service: Kumwe\Automation\JitterSource
    factory: Kumwe\Automation\ConfigProvider
    note: "Provider alias to the package CryptographicJitterSource, replacing the host share that bound the App port to the App source."
  - service: Kumwe\Automation\JobHandlerRegistry
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Intentional host binding: the package JobHandlerRegistryFactory resolves static service ids from kumwe.automation.handlers and cannot wrap contributed handlers in the trust-enforcing adapter, so the kernel does not admit it and keeps building the registry from the twelve core handlers and the admitted extension contributions; kumwe.automation.handlers stays empty."
  - service: Kumwe\Automation\JobQueue
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host port binding re-keyed from the retired App name to the package port; DoctrineJobQueue is unchanged."
  - service: Kumwe\Automation\QueueRuntimePolicyCatalog
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host port binding re-keyed from the retired App name to the package port; ContributedQueueRuntimePolicyCatalog is unchanged."
