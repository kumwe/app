di_changes:
  - service: Kumwe\BusinessSchema\Compiler\CanonicalDefinitionPhysicalSchemaCompiler
    factory: Kumwe\BusinessSchema\Container\PhysicalSchemaCompilerFactory
    note: "Package factory installed through Kumwe\\BusinessSchema\\ConfigProvider; it resolves the three typed host bindings below from the container and refuses to construct without them. The provider advertises its factories as bare class names, so the kernel admits only the two container factories the package exports before installing them. The App compiler under Kumwe\\App\\BusinessSchema\\Infrastructure\\Schema is removed."
  - service: Kumwe\BusinessSchema\Planner\SchemaChangePlanner
    factory: Kumwe\BusinessSchema\Container\SchemaChangePlannerFactory
    note: "Package factory installed through the same provider; the shared stateless planner is injected into the retained App BusinessSchemaPlanner, whose private operations, containsPinnedRowBreakingChange, hasRecordRepin and dependencyHandles helpers it replaces. The App class keeps plan, purgePlan and observePublishedGraph, so no symbol pair names it."
  - service: Kumwe\BusinessSchema\Contract\DefinitionSchemaLookup
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package target-lookup port to the new PublishedDefinitionSchemaLookup, which answers it from BusinessDefinitionRepository::published() for the site identifier the compiler passes and the version a repin hint pins."
  - service: Kumwe\BusinessDefinition\Application\FieldTypeDefinitionResolver
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host aliases the package resolver port, which kumwe/business-definition's service map aliases to its FieldTypeRegistry and KUMWE-MIG-2026-010 deliberately left unbound, to DoctrinePersistedFieldTypeDefinitionResolver, the persisted resolver the removed App compiler was constructed with, because the package compiler factory resolves the port by name."
  - service: Kumwe\BusinessSchema\Domain\PhysicalNameCompiler
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Re-keyed from the retired App name; the host keeps sharing new PhysicalNameCompiler over the configured database table prefix, which the package validates with the same 28-byte bound and grammar the App DatabaseTablePrefix states."
  - service: Kumwe\App\BusinessSchema\Application\DefinitionPhysicalSchemaCompiler
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "The App port stays and is rebound from the removed App compiler to the new PortableDefinitionPhysicalSchemaCompiler, which hands the package compiler the SiteContext identifier; its three consumers, the planner, executor and lifecycle manager, are unchanged."
