    - "No performance claim is made; the protection walk copies only arrays that hold a sealed secret, and the package detaches nested arrays once per admitted value."
compatibility: "Drop-in for stored data: the five types keep their names and public members under Kumwe\\Record\\Model, RecordScope is typed on the Kumwe\\BusinessDefinition\\Domain\\ScopeMode App already uses, and every checksum, fingerprint and revision byte is unchanged, which RecordIntegrityTest pins by exact digest. The package constructors admit values through Kumwe\\Record\\Value\\RecordValueGuard themselves and cannot know a sealed Kumwe\\Secret\\Value\\EncryptedEnvelope, so App applies RecordValueProtection::protect() to the value map immediately before it constructs or advances a record (BusinessRecordService, DoctrineBusinessRecordReadRepository) and RecordValueCodec rebuilds the envelope from that ProtectedRecordValue when it seals or stores the field; a revision snapshot already reaches the constructor in canonical form. Four refusals tighten: a revision actor must match ^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$, a revision snapshot or changed-field list holds at most 256 entries, the optimistic version refuses to advance past PHP_INT_MAX, and nested arrays are detached from caller references. Every actor identifier App stamps satisfies the grammar and no App fixture crosses a bound."
migration_recovery: null
security_impact: "None on authority: scope derivation still takes the site from the execution context, policy, disclosure, sealing, decryption, associated data, key custody and rotation stay in the App adapters, the package performs no cryptography and never sees a connection or a request, and a sealed secret reaches the package aggregates only as the opaque protected storage App substitutes for it."
performance_claim: null
rollback: "Revert the App pull request: the pin, the five removed classes, the moved unit test, the trimmed replay-window test and the two retired coverage attributes return from the baseline commit, and no persisted data changes."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the native runtime are proven by the App CI on this pull request."
  - "The published tag commit 907d5175fe4c6fe1d30e8fa92560dc569631d98d lies outside the package repository's default-branch history: main was reset after the merge that produced it and the same change was re-merged as ba941954da28d238a579315a11d3d0976b3a24bf, whose tree equals the tag's; the immutable release, the Packagist coordinate and the lock all bind the tag commit, and a later package release from default-branch history would be a separate adoption."
  - "kumwe/extension-sdk 0.2.4 still ships Kumwe\\Extension\\Spi\\BusinessRecord\\Application\\BusinessRecordRequestGuard and calls it from its own read request and custom-action classes; App never referenced it, so the ledger maps it without swapping anything, and the 0.3.2 train (KUMWE-MIG-2026-033) removes the copy."
  - "The D14 assertion that no deciding path reads a client-asserted instant no longer lists the replay window, which is package source; App keeps the assertion that the replay horizon is measured from the server's own claim instant."
  - "The package's release-dependencies manifest marks kumwe/access-context 0.1.2, kumwe/business-definition 0.1.2 and kumwe/record-values 0.1.4 as not independently verified by design; the App's KUMWE-MIG-2026-004, KUMWE-MIG-2026-010 and KUMWE-MIG-2026-029 attestations cover those releases."
