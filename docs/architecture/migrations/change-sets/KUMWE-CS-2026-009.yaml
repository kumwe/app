compatibility: "The thirty-six moved types keep their names and shapes under Kumwe\\Access, and the SDK Capability is read as Kumwe\\Access\\Capability by every App consumer while extension-sdk 0.2.4 keeps its own class for its internal string conversions. The two App decision models merge into the four-state AuthorizationDecision: the gateway constructs DecisionState verdicts, the identity service and role-grant policy attribute theirs to core.identity-authorization.v1 and core.role-grant.v1, and the structured decision log gains a state field. The policy registry and the ownership-scope policy now take the host tables explicitly, which HostAccessPolicy states; system identities cross into the package policy as their system: codes. The retained MCP machine contract mcp-v1 keeps every tool, error code, message and retry flag; its authorization.denied classification now names the package exception, so the generation's registry and contract digests move with that one string."
migration_recovery: null
security_impact: "None on authority: the deny-by-default gateway, provenance, containment, delegation ceiling, membership freshness, system-identity confinement, principal issuance and every Doctrine adapter stay in App. The seven membership-sensitive types and the forty-four reserved ownership categories move from class constants to HostAccessPolicy, are handed to the package factories as configuration that refuses to build without them, and are pinned by the retained unit tests; a step-up decision from an identity policy now outranks an allowance instead of being unrepresentable."
performance_claim: null
rollback: "Revert the App pull request and restore the thirty-six removed classes and four unit tests from the baseline commit; no persisted data changes, and the four self-checksumming migrations whose imports moved keep their pre-move checksums accepted."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the native runtime path are proven by the App CI on this pull request."
  - "The App pull request did not exist when this record was written; app_pr, the ledger app_pull_request and the train merge order are completed when it is opened, and the CHANGELOG entry then cites it."
  - "kumwe/extension-sdk 0.2.4 still declares Kumwe\\Extension\\Spi\\Identity\\Domain\\Capability for its own route and navigation definitions; both classes coexist without an alias until the verified extension-sdk 0.3.2 train retires the SDK copy."
  - "The package documents the MembershipDirectory extraction in docs/membership-source-map.json under KUMWE-MIG-2026-023 rather than in its extracted_symbols; this ledger records the swap of the twenty-two App consumers to the package port so that kumwe/approval resolves the same service id."
  - "The release attestation was produced in the adoption worktree rather than by an isolated verifier; it records the tag, archive, registry and workflow facts observed there."
completion_claim: false
