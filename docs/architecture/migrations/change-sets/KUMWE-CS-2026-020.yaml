compatibility: "Drop-in for consumers: the seven types keep their names and shapes under Kumwe\\Idempotency; IdempotencyKey gains fromString() and value(), and IdempotencyRecord::begin() and IdempotencyResult take an explicit CanonicalEncoder, which no App production code calls. The HTTP key is now the package key while business-record commands keep the kumwe/extension-sdk 0.2.4 key, bridged in BusinessRecordApiRequest::idempotencyKey()."
migration_recovery: null
security_impact: "None on authority: exact route preauthorization, credential fingerprints, transaction coupling, the secret-once body stripping and the purge capability stay in the App middleware, adapters and job handler; the package never sees a request, a connection or a credential."
performance_claim: null
rollback: "Revert the App pull request and restore the seven removed classes and two unit tests from the baseline commit; no persisted data changes, since the idempotency table, its request digests and its retention migrations are untouched."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the native encoder path are proven by the App CI on this pull request."
  - "Mixed key types remain until the extension-sdk train: the HTTP key is Kumwe\\Idempotency\\IdempotencyKey while business-record commands and the kumwe/extension-sdk 0.2.4 CustomBusinessActionCommand and CustomBusinessActionResult still take Kumwe\\Extension\\Spi\\Application\\Automation\\IdempotencyKey; BusinessRecordApiRequest::idempotencyKey() bridges with fromString((string) $key), and the 34 App files importing the SDK key swap with that train."
  - "kumwe/extension-sdk 0.3.2 requires kumwe/idempotency 0.1.2 exactly, so its train can no longer resolve against a lock holding 0.1.3; an extension-sdk successor pinning 0.1.3 (as kumwe/business-surface-contract 0.1.4 already does) precedes that train."
  - "The release record's old_namespace_roots name Kumwe\\App\\Application\\Automation\\, Kumwe\\App\\Delivery\\Http\\Api\\Idempotency\\ and the SDK root, which App still populates; the ledger retires only the vacated Kumwe\\App\\Application\\Idempotency\\ and enumerates the seven symbols."
  - "The release attestation was produced in the adoption worktree before the Phase 2 edits rather than in a separate context, and the package's own export-ignored test suite was not executed there."
