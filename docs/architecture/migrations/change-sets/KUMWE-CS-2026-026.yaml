compatibility: "Drop-in for the namespace-only moves of the cron expression, retry values, job envelope, lease, status, execution class, stored job, queue and handler ports and the queue runtime policy; JobEnvelope::pending, JobContributionDefinition::fromArray and ScheduleContributionDefinition::fromArray take the canonical encoder as their first argument, and the FailureClassification the integration store ports receive is the package enum. Persisted job rows, schedules and idempotency keys are unchanged."
migration_recovery: null
security_impact: "None on authority: trust-enforcing handler wrapping, the queue worker, the scheduler, automation management and the lease-aware execution scope stay in App; the package receives already admitted handlers and configuration."
performance_claim: null
rollback: "Revert the App pull request; the twenty-two removed classes and four unit tests return with the train baseline and no persisted data changes."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "One Composer lock regeneration covers the whole train, so composer_lock_digest is the digest of the train lock rather than of a lock that adds this package alone."
  - "The hosted GitHub tag tar.gz and the Packagist zipball were not downloaded: the outbound proxy of the verification run refused HTTP access to kumwe/automation, so the attested digest is of the uncompressed git archive of the tag commit and the GitHub release and workflow run were not queried."
  - "The tag archive carries no export-ignore rules, so the released tree ships its tests, tools and CI configuration; the seventy-seven tracked files are the archive."
  - "The package JobHandlerRegistryFactory is not admitted because it cannot express the trust-gated contributed handler set; the host keeps building JobHandlerRegistry and records the binding under di_changes."
  - "The handoff records Kumwe\\App\\Application\\Automation\\ and Kumwe\\App\\BusinessIntegration\\Domain\\ as retired roots wholesale; the App keeps Worker, Scheduler, AutomationManagementService and the other host classes under the former, so the ledger retires no root for this package and lists the twenty-four symbols instead; the latter is retired by KUMWE-MIG-2026-027."
  - "The handoff lists CronExpressionTest, JobEnvelopeTest, JobLeaseTest and RetryPolicyTest among the tests to retain; they test only the moved values, which the package suite now owns, so they are removed as implementation tests."
  - "kumwe/extension-sdk 0.3.3 is adopted from its unpublished candidate, pull request 22 at commit b54022b05075944e884dc1df038cbcb63f723472, through a temporary package repository entry in composer.json; the entry is removed and the lock re-pointed at the Packagist distribution once v0.3.3 is published (KUMWE-CS-2026-033)."
