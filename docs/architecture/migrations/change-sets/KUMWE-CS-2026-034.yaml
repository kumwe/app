compatibility: "Drop-in for consumers: the thirty types keep their names and shapes under Kumwe\\Content, ContentRepository carries the adopt() port the App adapter already implemented, and WorkflowTransitionDefinition prices its edge with Kumwe\\Access\\Capability, which every App consumer already reads. The package values now refuse content data and schemas that are not bounded JSON and workflow state and transition sets that are not typed bounded lists, which the App classes accepted; the Doctrine adapters, migrations and demo installers only ever passed decoded JSON arrays and typed members. The retained MCP machine contract mcp-v1 keeps every tool, error code, message and retry flag; its content.not_found, content_model.not_found and version.conflict classifications now name the package exceptions, so the generation's registry and contract digests move with those three strings."
migration_recovery: null
security_impact: "None on authority: capability checks, workflow transition pricing, transaction coupling, site ownership, audit recording and every Doctrine adapter stay in App; the package tightens the content and schema value bounds and refuses object-bearing data before it is stored."
performance_claim: null
rollback: "Revert the App pull request and restore the thirty removed classes and nine unit tests from the baseline commit; no persisted data changes, and the two self-checksumming migrations whose imports moved keep their pre-move checksums accepted."
known_gaps:
  - "Core Growth Record KUMWE-CGR-2026-005 is retired in this change set: its remaining approved symbols (ContentEntry, TranslationGroup, TranslationGroupMember) moved to kumwe/content-model here and its business-definition symbols moved with KUMWE-MIG-2026-010, so no App symbol it approved exists in src/ and the schema admits no empty record; the ledgers now carry those ownership decisions."
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the native runtime path are proven by the App CI on this pull request."
  - "The installed record retires Kumwe\\App\\Content\\Application\\ as a whole, but ContentService and ContentModelService stay there by the record's own exclusion, so the ledger retires only the Content and Workflow domain roots and enumerates the eleven application symbols."
  - "The installed record's consumer inventory predates the Studio authoring services, ContentServiceAdoptContentTypeTest and HostedContentStudioAuthoringConfigurationProviderTest; the ledger records the observed consumer set."
  - "kumwe/extension-sdk 0.2.4 still declares Kumwe\\Extension\\Spi\\Identity\\Domain\\Capability for its own route and navigation definitions; the workflow transition capability is the package Kumwe\\Access\\Capability the App already reads everywhere."
  - "The package refuses a non-finite number inside a content-type schema when the definition is constructed, so the Studio projector's own non-finite default refusal can no longer be reached through a ContentTypeDefinition; ContentStudioProjectorTest now feeds a mistyped number default through the same coordinate and the projector branch stays as defence in depth."
  - "The release attestation was produced in the adoption worktree rather than by an isolated verifier; it records the tag, archive, registry and workflow facts observed there."
