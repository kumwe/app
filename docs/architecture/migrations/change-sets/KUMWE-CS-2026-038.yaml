compatibility: "Drop-in for the eighteen SDK contracts except for three signature changes: FieldPresentationModel takes the canonical encoder as its ninth positional argument, and CustomBusinessActionCommand and CustomBusinessViewQuery carry Kumwe\\Context\\Value\\ExecutionContext and Kumwe\\Idempotency\\IdempotencyKey directly, so the App dispatcher and executor stop wrapping the host context and the API request stops re-wrapping the idempotency key. Rendered models and persisted action ledgers are unchanged."
migration_recovery: null
security_impact: "None on authority: custom handler admission, binding, authorization, the action ledger and rendering stay in App; the package owns the command, query, handler and presentation contracts."
performance_claim: null
rollback: "Revert the App pull request; the SDK 0.2.4 contracts and the removed foreign-context refusal tests return with the train baseline and no persisted data changes."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "One Composer lock regeneration covers the whole train, so composer_lock_digest is the digest of the train lock rather than of a lock that adds this package alone."
  - "The package CHANGELOG.md carries an Unreleased section above the 0.1.4 record."
  - "The package commands are typed on the concrete host ExecutionContext, so the App tests that proved refusal of a foreign extension execution context (CustomBusinessActionExecutorTest and CustomBusinessHandlerRegistryTest) no longer have a subject and those methods are removed; the remaining methods stay."
  - "The Packagist p2 fetch was reset by the peer on the first attempt at 2026-09-23T18:20:46Z and succeeded on the retry recorded in the attestation."
  - "The package query and command carry the host ExecutionContext while the SDK BusinessRecordReadRequest takes the SDK context interface the App reader honours only when the App issued it, so a custom view or action handler could no longer read records through the SDK port; the App composes the released types through CustomBusinessInvocationScope (KUMWE-CGR-2026-014): the dispatcher enters it with the invocation host context and the reader resolves a context naming the same coordinates to it. An upstream release that hands custom handlers an SDK context, or the SDK reader a host one, retires the scope."
  - "kumwe/extension-sdk 0.3.3 is adopted from its unpublished candidate, pull request 22 at commit b54022b05075944e884dc1df038cbcb63f723472, through a temporary package repository entry in composer.json; the entry is removed and the lock re-pointed at the Packagist distribution once v0.3.3 is published (KUMWE-CS-2026-033)."
