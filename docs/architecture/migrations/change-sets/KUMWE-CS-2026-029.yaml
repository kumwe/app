    - "No performance claim is made; the adapter copies only arrays that hold a sealed secret and walks no deeper than the guard's own bound."
compatibility: "Drop-in for stored data: the guard, the client-asserted instant and the zoned date-time keep their names and public members under Kumwe\\Record\\Value, and every checksum, fingerprint and revision byte is unchanged because App substitutes ProtectedRecordValue(EncryptedEnvelope::toStorage()) before the guard and the guard canonicalises that storage as the same four strings in the same order. Three refusals tighten: canonical() applies the 8-deep, 4096-node budget to the whole tree it reduces, the four storage members of each sealed secret count toward that budget, and ClientAssertedInstant::fromPortableString accepts only offsets within -14:00..+14:00 with minutes 00-59, refuses a parse that raises a warning and holds capturedAt in UTC; no HTTP or OpenAPI surface reads the client instant, so the grammar change reaches only a PHP caller of WriteDocumentCommand."
migration_recovery: null
security_impact: "None on authority: sealing, decryption, associated data, key custody and rotation stay in the App adapters, the package performs no cryptography and never sees a connection or a request, and a raw EncryptedEnvelope is now refused by the guard unless App has wrapped it, which every App guard call does through RecordValueProtection."
performance_claim: null
rollback: "Revert the App pull request: the pin, the two removed classes, the two moved unit tests and the retired boundary assertions return from the baseline commit, and no persisted data changes."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the native runtime are proven by the App CI on this pull request."
  - "kumwe/extension-sdk 0.2.4 still ships Kumwe\\Extension\\Spi\\BusinessRecord\\Value\\ZonedDateTimeValue and its QueryValue admits only that copy; App passes scalars, DateTimeImmutable and ExactDecimal into the SDK filters and cursors, never a zoned value, so the two copies coexist without a refusal until the 0.3.2 train (KUMWE-MIG-2026-033) removes the SDK copy."
  - "An extension compiled against the SDK ZonedDateTimeValue would be refused by the package guard; no installed extension or example builds one, and the SDK successor resolves the split."
  - "The package's release-dependencies manifest marks kumwe/conversion 0.1.5 as not independently verified by design; the App's KUMWE-MIG-2026-031 attestation covers that release."
