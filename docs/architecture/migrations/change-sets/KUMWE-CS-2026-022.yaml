compatibility: "Drop-in for consumers: the fourteen types keep their names and shapes under Kumwe\\BusinessPolicy; the package additionally refuses operation names over 127 bytes, boolean children outside its closed tree and over-complex trees at construction and non-UTF-8 string literals, answers false for a comparison whose runtime string exceeds 4096 bytes or is not valid UTF-8 or whose decimal exceeds 4096 bytes, and compares decimal digit runs with strcmp instead of the numeric spaceship. DoctrineBusinessRecordQueryCompiler compiles the same SQL as before: its exact DECIMAL and NUMERIC casts match the lexical decimal rule, string policies only admit Equal and NotEqual and its byte-wise equality agrees with the fail-closed rule; only NotEqual over a stored string longer than 4096 bytes now differs, as recorded under known_gaps."
migration_recovery: null
security_impact: "None on authority: final authorization, step-up, active policy selection, actor and attribute loading, query compilation and post-load filtering stay in the App access controller and query compiler; the package tightens construction bounds and refuses foreign predicate implementations before evaluating them. The compiled query and the in-memory evaluator disagree only for a NotEqual string policy over a stored value longer than 4096 bytes, which is recorded under known_gaps."
performance_claim: null
rollback: "Revert the App pull request and restore the eight removed classes and the moved unit test from the baseline commit; no persisted data changes, and stored resource-policy rows keep their canonical JSON documents and digests."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the hosted database engines are proven by the App CI on this pull request."
  - "consumer_contract permitted_only_when clause 'the selected SDK release uses the same canonical package types' is satisfied by the pending extension-sdk 0.3.2 train (KUMWE-MIG-2026-033), not by the locked kumwe/extension-sdk 0.2.4, which still ships its own Kumwe\\Extension\\Spi\\BusinessSecurity copies: no SDK SPI outside that directory names them, examples/asset-inspection passes policies as toArray() documents, and the maintainer's order of 2026-09-09 (KUMWE-CS-2026-032, docs/roadmap/STATUS.md) lands the train package by package in dependency order; the six copies stay unreferenced vendor code, and the ledger retires Kumwe\\Extension\\Spi\\BusinessSecurity\\ so nothing under src/, tests/, config/, bootstrap/, resources/ or examples/ can name them again."
  - "SQL parity of DoctrineBusinessRecordQueryCompiler with RecordPolicyEvaluator 0.1.1 was re-checked: a string policy compiles to BINARY column <> BINARY ? on MySQL and column <> ? on PostgreSQL (revision snapshots through JSON_UNQUOTE and convert_to), which is true for a stored value longer than 4096 bytes where the evaluator now answers false; string fields admit up to 1,000,000 characters, so a NotEqual string policy over such a record can be included by a compiled list, count, aggregate or export query and refused by the in-memory detail, mutation, revision and relation checks, or the reverse under a deny predicate. Equal comparisons, null semantics, booleans, integers, temporals and decimals agree, stored text cannot be invalid UTF-8 on the utf8mb4 and UTF8 databases, and no installed decimal column can reach 4096 bytes. Closing the gap is a compiler guard on the stored octet length, to be proven on the three hosted database engines in a follow-up rather than in this adoption."
  - "The release attestation was produced in this adoption's worktree after the exact pin was installed; the tag, archive, Packagist and workflow identities were verified and the installed vendor copy compared byte for byte against the tag archive, but no clean consumer install outside App was executed."
