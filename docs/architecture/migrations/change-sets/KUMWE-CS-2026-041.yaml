compatibility: "Drop-in for the namespace-only moves of the thirteen App report definition types and the eight SDK reporting contracts; ProjectionBuilder is the package contract the owned binding registrar accepts, and the report definition registry, report service, scope resolver, export service and projection runtime stay App-owned."
