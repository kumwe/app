compatibility: "The 96 SDK exports keep their names; ExtensionManifest::fromJson, ManifestContributions::fromManifest, ExtensionContributionSummary::project, the toolchain scaffolder, inspector and builder, and the manifest declaration factories take an injected Kumwe\\CanonicalJson\\CanonicalEncoder, ManifestIdentifierPolicies::forKind projects manifest kinds onto the contribution package policies, and the eighty-eight duplicate declarations the SDK dropped resolve to their canonical owners through the other train ledgers. The Kumwe\\Extension\\Spi\\Application\\Automation\\IdempotencyKey copy maps to Kumwe\\Idempotency\\IdempotencyKey."
migration_recovery: null
security_impact: "None on authority: admission, trust, activation, key custody and persistence stay in App; the same PackageInspector instance, constructed with the container encoder, serves the author toolchain and the admission path."
performance_claim: null
rollback: "Revert the App pull request and restore the 0.2.4 lock and the legacy registry entry from the train baseline; no persisted data changes, because manifests, checksums and stored contribution rows are unchanged."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "One Composer lock regeneration covers the whole train, so composer_lock_digest is the digest of the train lock rather than of a lock that adds this package alone."
  - "The 0.3.3 pin was first locked from the candidate commit b54022b05075944e884dc1df038cbcb63f723472 of pull request 22 through a temporary package repository entry in composer.json while v0.3.3 was unpublished; the entry is removed, the lock names the Packagist distribution of the tag commit 3d91050261bc26a5d89966250f88b11705b4923b (identical tree) and the attestation binds the tag tar.gz."
  - "kumwe/conversion-extension 0.1.4 is not adopted with this train: its shipped MIGRATION-HANDOFF.md carries multi-line plain scalars outside the StrictYaml subset the capability index reads, so the index refuses the installed package; App keeps its MoneyRateProviderDefinition and UnitConversionProviderDefinition over the package ContributionDefinition until a successor release ships a conforming record (KUMWE-MIG-2026-028 stays unallocated)."
  - "The legacy registry no longer lists kumwe/extension-sdk; its three retired App roots move to this ledger."
completion_claim: false
