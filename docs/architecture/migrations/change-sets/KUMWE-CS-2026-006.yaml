compatibility: "Drop-in for the definition and surface interfaces, whose members are unchanged. ContributionOwner::assertOwns now takes a SurfaceIdentifierPolicy instead of a kind string and refuses with ContributionRejected, an InvalidArgumentException subclass, so every App registry and static call site names its policy explicitly, through the SDK ManifestIdentifierPolicies::forKind projection or an explicit slash policy for the canonical composition documents; identifiers, owners and stored contribution rows are unchanged."
migration_recovery: null
security_impact: "None on authority: ownership assertion moves from a kind string to an explicit per-surface policy that the host chooses, and the trusted lifecycle composition, executable registries and admission stay in App."
performance_claim: null
rollback: "Revert the App pull request; the removed ContributionSurface interface returns with the train baseline and no persisted data changes."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "One Composer lock regeneration covers the whole train, so composer_lock_digest is the digest of the train lock rather than of a lock that adds this package alone."
  - "The hosted GitHub tag tar.gz and the Packagist zipball were not downloaded: the outbound proxy of the verification run refused HTTP access to kumwe/contribution, so the attested digest is of the uncompressed git archive of the tag commit and the GitHub release and workflow run were not queried."
  - "ContributionRejected replaces the InvalidArgumentException messages the App asserted; the one App test that read the message now asserts the package message."
  - "kumwe/extension-sdk 0.3.3 is adopted from its unpublished candidate, pull request 22 at commit b54022b05075944e884dc1df038cbcb63f723472, through a temporary package repository entry in composer.json; the entry is removed and the lock re-pointed at the Packagist distribution once v0.3.3 is published (KUMWE-CS-2026-033)."
