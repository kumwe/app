compatibility: "Drop-in for consumers of the twenty-one namespace-only value moves; two differences drive code: the package compiler takes a bare site identifier through the DefinitionSchemaLookup port instead of SiteContext and BusinessDefinitionRepository, which the host adapters absorb behind the unchanged App DefinitionPhysicalSchemaCompiler port, and the diff itself is the public SchemaChangePlanner the App planner now receives. Blueprints, plans, steps and checksums are byte-identical to the App copies."
migration_recovery: null
security_impact: "None on authority: planning, approval, execution and destructive-purge capability checks, the execution lock and fences, transactions, audit and persistence stay in the App planner, executor, service and repositories; the package receives already authorized definitions and blueprints."
performance_claim: null
rollback: "Revert the App pull request and restore the twenty-two removed classes and six unit tests from the baseline commit; no persisted data changes, because plan, step and installation payloads and their checksums are unchanged."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "BusinessSchemaPlanner is a partial extraction: the package SchemaChangePlanner now owns its former private operations, containsPinnedRowBreakingChange, hasRecordRepin and dependencyHandles helpers and is injected, while the App class keeps plan, purgePlan, observePublishedGraph and persistPlan; the ledger lists no symbol pair for it because the App class is retained under its name."
  - "The released record marks CanonicalDefinitionPhysicalSchemaCompilerTest as a mixed suite with no retained method; a test file with zero test methods cannot stay, so it is removed and its one retained assertion, that the host-composed validator admits an unindexed 1000-character text field, lives in tests/Unit/BusinessDefinition/Domain/EntityTypeDefinitionTest.php under the definition owner."
  - "SchemaEvolutionHints::fromDefinition() in the package no longer carries the App's explicit refusal of non-string compatibility-metadata keys, which existed at the extraction baseline: an EntityTypeDefinition whose compatibility metadata mixes an integer key with string keys now raises a TypeError from looksLikeEvolutionKey() where the App raised InvalidBusinessSchema; the definition is still refused and the publication transaction still rolls back, and the domain-typed refusal is to be restored in a package successor release."
  - "The package ConfigProvider documents its factories as bare class-strings rather than as the container factory classes it ships, so the kernel admits only PhysicalSchemaCompilerFactory and SchemaChangePlannerFactory before installing the provider; a package successor that types the provider makes that guard unnecessary."
  - "The package compiler reports an unavailable or version-mismatched relationship target with one message where the App compiler distinguished an absent catalog entry from an unpublished version; no App test or consumer reads either message."
  - "The release attestation was produced by an isolated verification restricted to inspection; no clean consumer install was executed there."
