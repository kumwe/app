compatibility: "Conditions, formulas and invariants follow the frozen formula-draft/1 corpus; reports follow the frozen report-materialization-draft/1 corpus with rows in their declared output order; persisted digests are byte-identical under the native encoder. The dependency, collection and float refusals keep the corpus wording; Engine-transported refusals carry one stable operator text under InvalidBusinessDefinition and ReportUnavailable. RecordRuleValidator, RecordExpressionValues, ValidationViolation, DocumentWriteBudget and RuntimeCanonicalJson stay App-owned."
migration_recovery: null
security_impact: "Pinned digest-verified native source and independently recorded deployment tuple; missing or mismatched runtime identity refuses boot and every evaluation. Only the field handles and owned-line collections an expression reads are marshalled to the runtime."
performance_claim: null
rollback: "Revert the App pull request and rebuild the previous images; no persisted data format changes, because the native encoder reproduces the retired encoder's bytes."
known_gaps:
  - "The final App head must pass all required hosted checks before merge."
  - "The local sandbox ran PHP 8.5.9 with ext-kumwe_engine 1.0.3 and MariaDB 10.11 only, so MySQL, PostgreSQL, the browser lanes and the coverage ratchet on the canonical leg are proven by the App CI on this pull request."
  - "The native ABI transports an evaluation refusal as its category only; Engine-decided refusals are reported with one stable text, and the corpus wording is kept for the dependency, collection and float refusals the App decides before the call."
  - "A report whose authorized rows exceed 100000, whose materialized result exceeds 16 MiB or whose input document exceeds 64 MiB is refused as unavailable; no PHP materialization remains."
  - "The formula adapter caches at most 32 compiled plans of the runtime's 64-plan pool and releases the least recently used; report plans are released after each execution."
  - "RecordRuleValidator, RecordExpressionValues, ValidationViolation, DocumentWriteBudget and RuntimeCanonicalJson stay App-owned; the record-model normalized-document cutover is separate work."
