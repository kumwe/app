compatibility: "Drop-in for the namespace-only moves; RecordedDomainEvent, RecordedIntegrationEvent, EventSchemaDefinition::fromArray, ProcessInstance and ProcessWorkItem hydration take the canonical encoder, the outbox, inbox and process manager ports fail with Kumwe\\Automation\\FailureClassification, and OwnedRuntimeContributionRegistry admits the package definitions. Persisted outbox, inbox and process rows and their checksums are unchanged."
migration_recovery: null
security_impact: "None on authority: consumer dispatch, durable outbound adapters, process cancellation, transport and the Doctrine stores stay in App; the package validates contracts and payloads it is handed."
performance_claim: null
rollback: "Revert the App pull request; the twenty removed classes and three unit tests return with the train baseline and no persisted data changes."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "One Composer lock regeneration covers the whole train, so composer_lock_digest is the digest of the train lock rather than of a lock that adds this package alone."
  - "The tag commit is not an ancestor of the repository main branch; the main head tree is byte-identical to the tag tree, and the release-on-record workflow ran on the tag commit itself."
  - "The tag archive carries no export-ignore rules, so the released tree ships its tests, tools and CI configuration; the eighty-seven tracked files are the archive."
  - "Kumwe\\Integration\\ConfigProvider is not installed: its EventContractRegistryFactory reads schemas and consumers from configuration, which cannot express the catalog the extension contribution registry set validates and replaces under generation transitions, so the host shares that registry under the package name and records the binding under di_changes."
  - "The handoff lists EventContractTest, ProcessInstanceTest and IntegrationContributionDefinitionTest among the tests to retain; they test only the moved values, which the package suite now owns, so they are removed as implementation tests."
  - "kumwe/extension-sdk 0.3.3 is adopted from its unpublished candidate, pull request 22 at commit b54022b05075944e884dc1df038cbcb63f723472, through a temporary package repository entry in composer.json; the entry is removed and the lock re-pointed at the Packagist distribution once v0.3.3 is published (KUMWE-CS-2026-033)."
