compatibility: "Drop-in for consumers of the thirty-three namespace-only moves; three differences drive code: BusinessDefinitionValidator requires a host FieldConfigurationAdmission, and Expression::evaluate() and RecordInvariantDefinition::isSatisfied() no longer exist, so every runtime caller evaluates through the App ExpressionEvaluator. The package validator additionally refuses expression reads outside their field's scalar family, non-boolean field conditions at construction and over-long text defaults measured with mbstring, and classifies entity label-translation changes as behaviour-changing."
migration_recovery: null
security_impact: "None on authority: publication authorization, ownership, extension trust, transaction coupling and audit stay in the App services; the package tightens definition admission and the host admission adapter keeps the SDK presentation budget in force."
performance_claim: null
rollback: "Revert the App pull request and restore the thirty-six removed classes and eleven unit tests from the baseline commit; no persisted data changes, because the canonical definition bytes and checksums are unchanged."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "Previously published definitions that the stricter package validator would now refuse are not rewritten; the neutral fixture and the VDM definitions admit unchanged, and the hosted database lanes observe the demo profiles."
  - "The release attestation was produced by an isolated verification restricted to inspection; no clean consumer install was executed there."
