compatibility: "Drop-in for the twenty-one namespace-only moves; SurfaceDefinition implements the package ContributionDefinition, the interface-surface registry and presentation preference policies retype to it, and the programme verifier reads the core surface definitions from the installed package source. PresentationPreference, its key and value stay in App."
migration_recovery: null
security_impact: "None on authority: presentation preference persistence, policy and the programme verification stay in App; the package owns the declaration vocabulary and the conformance validator."
performance_claim: null
rollback: "Revert the App pull request; the twenty-one removed classes and two unit tests return with the train baseline and no persisted data changes."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the demo profile installations are proven by the App CI on this pull request."
  - "One Composer lock regeneration covers the whole train, so composer_lock_digest is the digest of the train lock rather than of a lock that adds this package alone."
  - "GitHub release v0.1.2 reports immutable false; tag protection and rulesets were not queried."
  - "The tag archive carries no export-ignore rules, so the released tree ships its tests, tools and CI configuration; the sixty-eight tracked files are the archive."
  - "The handoff lists SurfaceDefinitionTest and SurfaceIdentifierParityTest among the tests to retain; the former tests only the moved definition and the latter compares identifier grammars of types every train package now owns, so both are removed and the programme evidence records repoint to the package suite and the retained boundary test."
  - "The handoff retires Kumwe\\App\\InterfaceStandard\\ wholesale; PresentationPreference, PresentationPreferenceKey and PresentationPreferenceValue remain App-owned under that root, so the ledger retires no root and lists the symbols."
  - "kumwe/extension-sdk 0.3.3 is adopted from its unpublished candidate, pull request 22 at commit b54022b05075944e884dc1df038cbcb63f723472, through a temporary package repository entry in composer.json; the entry is removed and the lock re-pointed at the Packagist distribution once v0.3.3 is published (KUMWE-CS-2026-033)."
