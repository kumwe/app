security_impact: "None on authority: capability checks, transaction coupling, append-only guards, export key custody and retention stay in the App adapters; the package tightens metadata bounds and refuses object-bearing metadata before it is recorded."
performance_claim: null
rollback: "Revert the App pull request and restore the thirteen removed classes and four unit tests from the baseline commit; no persisted data changes, and databases migrated before the move keep their recorded tamper-evidence migration checksum."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the native encoder path are proven by the App CI on this pull request."
  - "Byte parity between the host-bound native generic-v1 encoder and the retired Kumwe\\App\\Shared\\Domain\\CanonicalJson encoding of already-stored audit rows was asserted on the canonical-json corpus (KUMWE-MIG-2026-007); a pre-adoption database must still report audit:verify intact after upgrade, which the hosted database lanes observe."
  - "The release attestation was produced by an isolated verification agent restricted to inspection; no clean consumer install was executed there."
