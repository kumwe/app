compatibility: "Drop-in for consumers: the thirteen types keep their names and shapes under Kumwe\\Audit; AuditEventDigest::compute() and AuditAnchorDigest::compute() take the host CanonicalEncoder explicitly, and the package values refuse unbounded metadata, empty exports, malformed checksums and inconsistent report counters that the App classes accepted."
