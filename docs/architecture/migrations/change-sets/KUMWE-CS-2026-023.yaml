compatibility: "The twelve moved types keep their names and shapes under Kumwe\\Approval. ApprovalService takes an explicit Ramsey UuidFactoryInterface as its ninth constructor argument and mints request, vote and audit identities as uuid4 instead of static uuid7; it gains expire(), and ApprovalStatus gains Expired, which DoctrineApprovalRepository records in resolved_at. ApprovalRepository::rule() takes a lock flag the Doctrine adapter honours with a platform row lock on the rule rows. The package refuses projections with non-UUID identities, rule codes, identities, actions, scopes and votes outside its patterns, expiry not after creation, quorum, approval or vote counts above thirty-two and notes with control characters; approval and rejection re-assert the frozen rule, revocation checks the exact scope, cancellation refuses an expired request, and the request lifetime is bounded to seven days inside the transaction. The retained MCP machine contract mcp-v1 keeps every tool, error code, message and retry flag; its authorization.denied classification now names the package approval exception, so the generation's registry and contract digests move with that one string."
migration_recovery: null
security_impact: "None on authority: the deny-by-default gateway, step-up verification and proof consumption, role and membership eligibility, the row locks and every Doctrine adapter stay in App. The package tightens the workflow it already governed: request creation and rule-freshness assertions hold the rule rows, approve and reject refuse a changed or deactivated rule and a mismatched scope, revoke refuses a foreign site, organization or workspace, and every projection is validated fail-closed before presentation."
performance_claim: null
rollback: "Revert the App pull request and restore the twelve removed classes and the unit test from the baseline commit; no persisted data changes, and rows the package wrote with uuid4 identities and expired status remain valid UUIDs and a status the schema already stored as a free string."
known_gaps:
  - "The local sandbox runs PHP 8.4 without ext-kumwe_engine and without a database server, so the integration and functional lanes, PHP 8.5 and the native runtime path are proven by the App CI on this pull request."
  - "The hosted GitHub tag tar.gz, the Packagist zipball, the GitHub release and the release workflow run of kumwe/approval were not observable from the adoption session; the attestation binds the tag commit through git ls-remote, a depth-one clone and the Packagist source and dist references, and its artifact digest is the git archive of that commit."
  - "The released record lists tests/Unit/BusinessSecurity/Application/ApprovalServiceTest.php both under remain_in_app_or_consumer and, by its prohibited_duplicates and tests_to_remove prose, as an implementation-owned duplicate; every one of its three tests drove the moved service through mocked ports, the package's own ApprovalServiceTest proves the same behaviour, so the file is removed and the retained host tests are the adapter, delivery, composition and database tests listed above."
  - "Stored approval rows written before the move satisfy the package projection validation by construction: identities were validated by the same binding patterns at write time, request identities are uuid7 strings the package accepts as UUIDs, rule codes are validated by the administration service's policy-code pattern, notes were bounded at five hundred characters, and expiry was always later than creation; a pre-adoption database must still render its approval inbox and detail after upgrade, which the hosted database lanes observe."
  - "The release attestation was produced in the adoption worktree rather than by an isolated verifier; it records the tag, clone, registry and installed-record facts observed there."
