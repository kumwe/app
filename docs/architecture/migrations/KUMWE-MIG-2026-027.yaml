di_changes:
  - service: Kumwe\Integration\EventContractRegistry
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Intentional host binding: the package EventContractRegistryFactory builds the registry from kumwe.integration.schemas and consumers configuration, which cannot express the catalog ExtensionContributionRegistrySet validates from admitted extension contributions and replaces under generation transitions, so Kumwe\\Integration\\ConfigProvider is not installed and the host shares the contribution-built registry under the package name."
  - service: Kumwe\Integration\OutboxStore
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host port binding re-keyed from the retired App name to the package port; DoctrineOutboxStore implements it, receives the canonical encoder for RecordedIntegrationEvent hydration and fails with Kumwe\\Automation\\FailureClassification."
  - service: Kumwe\Integration\InboxStore
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host port binding re-keyed from the retired App name to the package port; DoctrineInboxStore implements it with the same encoder and failure classification."
  - service: Kumwe\Integration\ProcessManagerStore
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host port binding re-keyed from the retired App name to the package port; DoctrineProcessManagerStore implements it, hydrates ProcessInstance and ProcessWorkItem through the canonical encoder and fails work with Kumwe\\Automation\\FailureClassification."
