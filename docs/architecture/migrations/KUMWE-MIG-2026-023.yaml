di_changes:
  - service: Kumwe\Approval\ApprovalService
    factory: Kumwe\Approval\Container\ApprovalServiceFactory
    note: "Package factory installed through Kumwe\\Approval\\ConfigProvider; it builds the shared maker-checker workflow from the nine host-bound ports and replaces the App closure that constructed the retired App service with eight arguments and static uuid7 identities."
  - service: Kumwe\Approval\ApprovalQueryService
    factory: Kumwe\Approval\Container\ApprovalQueryServiceFactory
    note: "Package factory installed through the same provider; it builds the shared scoped query service from the query repository, the package authorization gateway, the membership directory and the clock, replacing the App closure of the same shape."
  - service: Kumwe\Approval\ApprovalRepository
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package repository port to DoctrineApprovalRepository, re-keyed from the retired App port; the adapter now honours rule($binding, lock: true) with a platform row lock on the rule rows and records the package's Expired transition in resolved_at."
  - service: Kumwe\Approval\ApprovalQueryRepository
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package query port to DoctrineApprovalQueryRepository, re-keyed from the retired App port; expired rows are projected as terminal rows without decision, cancel or revoke controls, exactly as rejected and cancelled rows are."
  - service: Kumwe\Approval\StepUpProofConsumer
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package replay-fence port to DoctrineStepUpProofConsumer, re-keyed from the retired App port; BusinessSecurityAdministrationService and the administrator access-control handler consume the same binding."
  - service: Ramsey\Uuid\UuidFactoryInterface
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host shares a Ramsey UuidFactory so the package service factory resolves its explicit identity source; approval request, vote and audit identities are uuid4 from this factory instead of the retired service's static uuid7 calls."
