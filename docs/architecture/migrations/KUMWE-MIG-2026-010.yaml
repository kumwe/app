di_changes:
  - service: Kumwe\BusinessDefinition\Application\FieldConfigurationAdmission
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Host binds the package admission port to the App's SdkFieldConfigurationAdmission, which admits a field configuration exactly when extension-sdk 0.2.4's FieldPresentationConfiguration::fromArray accepts it; one shared instance is handed to the registry set, the validator and the package synchronizer. The package ships no default and its ConfigProvider is not configured."
  - service: Kumwe\BusinessDefinition\Application\FieldTypeRegistry
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Re-keyed from the retired App name; the host keeps sharing the contribution-fed registry the ExtensionContributionRegistrySet builds with new FieldTypeRegistry(false), so core built-ins still arrive through CoreContributionRegistrar. The package FieldTypeRegistryFactory, which seeds BuiltInFieldTypes, is not registered, and the service-map alias FieldTypeDefinitionResolver is not registered either: each consumer receives the live registry or the Doctrine persisted resolver explicitly, and DoctrinePersistedFieldTypeDefinitionResolver implements the package interface."
  - service: Kumwe\BusinessDefinition\Application\BusinessDefinitionValidator
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Re-keyed from the retired App name and constructed with the contribution-fed registry and the host admission adapter; it stays shared, where the service map declares the package factory non-shared, because the validator is stateless and BusinessDefinitionService holds it once. DoctrinePackageDefinitionSynchronizer builds its own validator over the persisted field types with the same admission port."
  - service: Kumwe\BusinessDefinition\Application\BusinessDefinitionContributionRegistry
    factory: Kumwe\App\Extension\Contribution\ExtensionContributionRegistrySet
    note: "Not a container key: the set constructs the registry around a validator built from its own field-type registry and the admission port it now requires as its first constructor argument; the package factory is not registered."
  - service: Kumwe\BusinessDefinition\Application\BusinessDefinitionCompatibilityAnalyzer
    factory: Kumwe\App\Kernel\ContainerFactory
    note: "Re-keyed from the retired App name; one shared stateless instance is consumed by BusinessDefinitionService and DoctrinePackageDefinitionSynchronizer, and the package classification of entity label-translation changes as behaviour-changing now applies to publication confirmations."
