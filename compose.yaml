name: kumwe

services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    working_dir: /app
    command: php -S 0.0.0.0:8080 -t public public/index.php
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kumwe}
      POSTGRES_USER: ${DB_USER:-kumwe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kumwe-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
