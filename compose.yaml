name: kumwe

services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    user: '${KUMWE_UID:-1000}:${KUMWE_GID:-1000}'
    working_dir: /app
    command: sh tools/development-server.sh
    init: true
    env_file:
      - .env
    environment:
      # Development Compose has one host-port source of truth. Direct PHP
      # processes may continue to use APP_BASE_URL from .env.
      APP_BASE_URL: "http://${KUMWE_HTTP_HOST:-localhost}:${KUMWE_HTTP_PORT:-8080}"
    volumes:
      - ./:/app
    ports:
      - "${KUMWE_HTTP_BIND:-127.0.0.1}:${KUMWE_HTTP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          $$body = @file_get_contents('http://127.0.0.1:8080/health/ready');
          $$data = is_string($$body) ? json_decode($$body, true) : null;
          exit(is_array($$data) && ($$data['status'] ?? null) === 'ready' ? 0 : 1);
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  database:
    image: ${KUMWE_DATABASE_IMAGE:-mariadb:lts}
    environment:
      DB_DRIVER: ${DB_DRIVER:-mariadb}
      MARIADB_DATABASE: ${DB_NAME:-kumwe}
      MARIADB_USER: ${DB_USER:-kumwe}
      MARIADB_PASSWORD: ${DB_PASSWORD:-kumwe-development-only}
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: ${DB_NAME:-kumwe}
      MYSQL_USER: ${DB_USER:-kumwe}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kumwe-development-only}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      POSTGRES_DB: ${DB_NAME:-kumwe}
      POSTGRES_USER: ${DB_USER:-kumwe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kumwe-development-only}
    volumes:
      - database-mysql-data:/var/lib/mysql
      - database-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${DB_DRIVER}" = pgsql ]; then
            pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}";
          elif command -v mariadb-admin >/dev/null 2>&1; then
            mariadb-admin ping --silent -h 127.0.0.1 -u"$${MARIADB_USER}" -p"$${MARIADB_PASSWORD}";
          else
            mysqladmin ping --silent -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}";
          fi
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${KUMWE_REDIS_IMAGE:-redis:8-alpine}
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database-mysql-data:
  database-postgres-data:
  redis-data:
