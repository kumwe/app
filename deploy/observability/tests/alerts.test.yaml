              description: "The endpoint is answering, so the process is fine, but the queue, outbox, retention and recovery gauges are stale or absent. The inhibition rules mute the alerts that read them until this clears."
              runbook: "docs/operations/runbooks.md#kumwemetricscollectionfailing"
              caught: "A least-privilege database account that had been granted rights on the application tables but not on the newer integration tables, which made half the alerting silently blind."
      - eval_time: "35m"
        alertname: "KumweMetricsCollectionFailing"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_metrics_scrape_duration_seconds{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "0.01x9 3x25 0.01x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweMetricsScrapeSlow"
        exp_alerts: []
      - eval_time: "30m"
        alertname: "KumweMetricsScrapeSlow"
        exp_alerts:
          - exp_labels:
              component: "observability"
              severity: "ticket"
            exp_annotations:
              summary: "Collecting Kumwe's gauges takes more than 2 seconds."
              description: "Every gauge is a bounded index probe, so a slow scrape means the database is slow for everyone, or a probe lost its index. The scrape will time out before the application does."
              runbook: "docs/operations/runbooks.md#kumwemetricsscrapeslow"
              caught: "A dropped index after a manual schema repair, which turned one gauge into a full table scan that timed out every scrape and blanked the dashboards during the incident it was needed for."
      - eval_time: "40m"
        alertname: "KumweMetricsScrapeSlow"
        exp_alerts: []
