# Generated by `php tools/verify-alert-rules.php --write` from scenarios.json and ../alerts.yaml.
# Run with: promtool test rules deploy/observability/tests/alerts.test.yaml
rule_files:
  - "../alerts.yaml"
evaluation_interval: "1m"
tests:
  - interval: "1m"
    input_series:
      - series: "up{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "1x9 0x15 1x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweScrapeTargetDown"
        exp_alerts: []
      - eval_time: "20m"
        alertname: "KumweScrapeTargetDown"
        exp_alerts:
          - exp_labels:
              component: "availability"
              instance: "app-1:9000"
              job: "kumwe"
              severity: "page"
            exp_annotations:
              summary: "Kumwe replica app-1:9000 is not answering scrapes."
              description: "The metrics endpoint has not answered for five minutes. Confirm the process is alive with GET /health/live before treating this as an application fault: a scrape failure alone can also mean the scrape credential or the network path changed."
              runbook: "docs/operations/runbooks.md#kumwescrapetargetdown"
              caught: "A replica that PHP-FPM stopped accepting connections on while its container kept passing its own liveness check, which the health probes alone would have reported as healthy."
      - eval_time: "30m"
        alertname: "KumweScrapeTargetDown"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_ready{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "1x9 0x20 1x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweReadinessFailing"
        exp_alerts: []
      - eval_time: "22m"
        alertname: "KumweReadinessFailing"
        exp_alerts:
          - exp_labels:
              component: "availability"
              instance: "app-1:9000"
              job: "kumwe"
              severity: "page"
            exp_annotations:
              summary: "Kumwe replica app-1:9000 has reported itself unfit for traffic for 5 minutes."
              description: "The replica's signed runtime marker is missing, stale or disagrees with the published generation, so the load balancer is draining it. A brief failure during a deploy is expected; five sustained minutes is not."
              runbook: "docs/operations/runbooks.md#kumwereadinessfailing"
              caught: "A replica left behind at an older extension runtime generation after an activation, which would otherwise have kept serving pages rendered from the wrong extension set."
      - eval_time: "35m"
        alertname: "KumweReadinessFailing"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_probe_success{check=\"liveness\",instance=\"probe-1:9100\",job=\"node\"}"
        values: "1x9 0x15 1x20"
      - series: "kumwe_probe_success{check=\"readiness\",instance=\"probe-1:9100\",job=\"node\"}"
        values: "1x45"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweSyntheticProbeFailing"
        exp_alerts: []
      - eval_time: "20m"
        alertname: "KumweSyntheticProbeFailing"
        exp_alerts:
          - exp_labels:
              check: "liveness"
              component: "availability"
              severity: "page"
            exp_annotations:
              summary: "The Kumwe synthetic probe check liveness is failing."
              description: "The probe exercises the deployment the way a visitor and a monitoring client do, from outside the process. A failing check with every internal signal green points at the ingress, TLS, DNS or the trusted-host configuration rather than at the application."
              runbook: "docs/operations/runbooks.md#kumwesyntheticprobefailing"
              caught: "A certificate renewal that left the ingress serving the old chain, which every in-cluster check reached around and only an external request could see."
      - eval_time: "30m"
        alertname: "KumweSyntheticProbeFailing"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_probe_last_run_timestamp_seconds{instance=\"probe-1:9100\",job=\"node\"}"
        values: "0+60x9 540x30 2460+60x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweSyntheticProbeStale"
        exp_alerts: []
      - eval_time: "32m"
        alertname: "KumweSyntheticProbeStale"
        exp_alerts:
          - exp_labels:
              component: "observability"
              severity: "ticket"
            exp_annotations:
              summary: "The Kumwe synthetic probe has not reported for 15 minutes."
              description: "The probe's schedule stopped or its textfile is no longer collected, so the availability page above cannot fire. Restore the probe before trusting a quiet pager."
              runbook: "docs/operations/runbooks.md#kumwesyntheticprobestale"
              caught: "A cron entry removed during a host rebuild, which silently disabled the only check that exercised the public ingress."
      - eval_time: "45m"
        alertname: "KumweSyntheticProbeStale"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_build_info{instance=\"app-1:9000\",job=\"kumwe\",release=\"2.0.0\",runtime=\"http\"}"
        values: "1x80"
      - series: "kumwe_build_info{instance=\"app-2:9000\",job=\"kumwe\",release=\"2.0.1\",runtime=\"http\"}"
        values: "_x9 1x40 stale"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweReleaseSkew"
        exp_alerts: []
      - eval_time: "45m"
        alertname: "KumweReleaseSkew"
        exp_alerts:
          - exp_labels:
              component: "availability"
              severity: "ticket"
            exp_annotations:
              summary: "More than one Kumwe release is serving traffic."
              description: "Two releases have been answering scrapes for half an hour. A rolling deploy passes through this state briefly; staying in it means a replica did not restart or a rollback stalled part-way."
              runbook: "docs/operations/runbooks.md#kumwereleaseskew"
              caught: "A deploy where one worker container failed its pull and silently kept running the previous release, producing intermittent behaviour that no single replica's logs explained."
      - eval_time: "56m"
        alertname: "KumweReleaseSkew"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_http_requests_total{instance=\"app-1:9000\",job=\"kumwe\",method=\"GET\",status=\"2xx\"}"
        values: "0+100x60"
      - series: "kumwe_http_requests_total{instance=\"app-1:9000\",job=\"kumwe\",method=\"GET\",status=\"5xx\"}"
        values: "0x9 0+10x25 250x25"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweServerErrorRateElevated"
        exp_alerts: []
      - eval_time: "30m"
        alertname: "KumweServerErrorRateElevated"
        exp_alerts:
          - exp_labels:
              component: "http"
              severity: "ticket"
            exp_annotations:
              summary: "More than 2% of Kumwe responses are server errors."
              description: "Sustained above the level a healthy installation reaches from isolated faults. Correlate with the log stream on outcome=failure and the request identifier before restarting anything."
              runbook: "docs/operations/runbooks.md#kumweservererrorrateelevated"
              caught: "A misconfigured trusted-host list after a domain change, which returned 5xx to a fraction of traffic while every health probe stayed green."
      - eval_time: "45m"
        alertname: "KumweServerErrorRateElevated"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_http_requests_total{instance=\"app-1:9000\",job=\"kumwe\",method=\"GET\",status=\"2xx\"}"
        values: "0+100x60"
      - series: "kumwe_http_requests_total{instance=\"app-1:9000\",job=\"kumwe\",method=\"GET\",status=\"5xx\"}"
        values: "0x9 0+30x20 600x25"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweServerErrorRateCritical"
        exp_alerts: []
      - eval_time: "22m"
        alertname: "KumweServerErrorRateCritical"
        exp_alerts:
          - exp_labels:
              component: "http"
              severity: "page"
            exp_annotations:
              summary: "More than 10% of Kumwe responses are server errors."
              description: "One request in ten is failing. Treat as an outage. Check readiness and the database first; the error boundary logs every unhandled exception with its request identifier."
              runbook: "docs/operations/runbooks.md#kumweservererrorratecritical"
              caught: "A database credential rotation applied to the secret store but not to the running containers, which readiness reported only after the connection pool had already started failing requests."
      - eval_time: "40m"
        alertname: "KumweServerErrorRateCritical"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_http_request_duration_seconds_bucket{instance=\"app-1:9000\",job=\"kumwe\",le=\"0.5\",method=\"GET\"}"
        values: "0+10x9 90x31 90+10x30"
      - series: "kumwe_http_request_duration_seconds_bucket{instance=\"app-1:9000\",job=\"kumwe\",le=\"5\",method=\"GET\"}"
        values: "0+10x70"
      - series: "kumwe_http_request_duration_seconds_bucket{instance=\"app-1:9000\",job=\"kumwe\",le=\"+Inf\",method=\"GET\"}"
        values: "0+10x70"
    alert_rule_test:
      - eval_time: "8m"
        alertname: "KumweRequestLatencyHigh"
        exp_alerts: []
      - eval_time: "35m"
        alertname: "KumweRequestLatencyHigh"
        exp_alerts:
          - exp_labels:
              component: "http"
              severity: "ticket"
            exp_annotations:
              summary: "Kumwe 95th-percentile request duration is above 2 seconds."
              description: "Latency this far above normal usually means database contention, a cold template cache after a deploy, or a saturated worker pool. Check the lock and connection signals before the application."
              runbook: "docs/operations/runbooks.md#kumwerequestlatencyhigh"
              caught: "A missing index after a business-schema plan executed, which showed up as slow pages long before it showed up as an error."
      - eval_time: "58m"
        alertname: "KumweRequestLatencyHigh"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_operation_duration_seconds_bucket{instance=\"app-1:9000\",job=\"kumwe\",le=\"5\",operation_class=\"document_1000_line_commit\"}"
        values: "0+10x9 90x31 90+10x30"
      - series: "kumwe_operation_duration_seconds_bucket{instance=\"app-1:9000\",job=\"kumwe\",le=\"10\",operation_class=\"document_1000_line_commit\"}"
        values: "0+10x70"
      - series: "kumwe_operation_duration_seconds_bucket{instance=\"app-1:9000\",job=\"kumwe\",le=\"+Inf\",operation_class=\"document_1000_line_commit\"}"
        values: "0+10x70"
    alert_rule_test:
      - eval_time: "8m"
        alertname: "KumweDocumentCommitLatencyHigh"
        exp_alerts: []
      - eval_time: "35m"
        alertname: "KumweDocumentCommitLatencyHigh"
        exp_alerts:
          - exp_labels:
              component: "http"
              operation_class: "document_1000_line_commit"
              severity: "ticket"
            exp_annotations:
              summary: "Kumwe document_1000_line_commit is taking more than 5 seconds at the 95th percentile."
              description: "Business documents are committing far outside the capacity contract's objective. This is the business-operation view of latency: it excludes transport retries and measures the whole command."
              runbook: "docs/operations/runbooks.md#kumwedocumentcommitlatencyhigh"
              caught: "A sequence allocation that serialized every document behind one hot row, which kept request latency acceptable on average while every large document stalled."
      - eval_time: "58m"
        alertname: "KumweDocumentCommitLatencyHigh"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_database_connections_in_use{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "20x9 95x20 20x20"
      - series: "kumwe_database_connections_max{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "100x50"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweDatabaseConnectionsSaturated"
        exp_alerts: []
      - eval_time: "25m"
        alertname: "KumweDatabaseConnectionsSaturated"
        exp_alerts:
          - exp_labels:
              component: "database"
              severity: "ticket"
            exp_annotations:
              summary: "The Kumwe database is above 90% of its connection ceiling."
              description: "New PHP-FPM children and workers will soon be refused a session. Check for leaked long-running sessions and for a worker pool scaled past what the server allows before raising the ceiling."
              runbook: "docs/operations/runbooks.md#kumwedatabaseconnectionssaturated"
              caught: "A worker scale-out from 4 to 40 replicas that left no connection headroom for the web tier, which failed requests with a driver error long before CPU or memory looked unusual."
      - eval_time: "35m"
        alertname: "KumweDatabaseConnectionsSaturated"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_database_replica_lag_seconds{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "0x9 120x20 0x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweDatabaseReplicaLagHigh"
        exp_alerts: []
      - eval_time: "25m"
        alertname: "KumweDatabaseReplicaLagHigh"
        exp_alerts:
          - exp_labels:
              component: "database"
              severity: "ticket"
            exp_annotations:
              summary: "A Kumwe database replica is more than a minute behind its source."
              description: "Reads routed to the replica are stale, and a failover now would lose the unreplicated tail. The gauge reads zero where the account may not inspect replication, so confirm on the server itself."
              runbook: "docs/operations/runbooks.md#kumwedatabasereplicalaghigh"
              caught: "A replica whose disk filled, which stopped applying the log without breaking replication, and would have been promoted during the next maintenance window with an hour of writes missing."
      - eval_time: "35m"
        alertname: "KumweDatabaseReplicaLagHigh"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_transaction_failures_total{instance=\"app-1:9000\",job=\"kumwe\",class=\"deadlock\"}"
        values: "0x9 0+2x20 40x30"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweDeadlocksFrequent"
        exp_alerts: []
      - eval_time: "28m"
        alertname: "KumweDeadlocksFrequent"
        exp_alerts:
          - exp_labels:
              component: "database"
              severity: "ticket"
            exp_annotations:
              summary: "Kumwe transactions are deadlocking repeatedly."
              description: "More than five deadlocks in ten minutes. Each one was rolled back and, where the caller retries, paid for twice. Two write paths are taking the same rows in opposite orders."
              runbook: "docs/operations/runbooks.md#kumwedeadlocksfrequent"
              caught: "An extension handler that updated a document header before its lines while the core path did the reverse, which only deadlocked under concurrent edits of the same document."
      - eval_time: "45m"
        alertname: "KumweDeadlocksFrequent"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_transaction_failures_total{instance=\"app-1:9000\",job=\"kumwe\",class=\"lock_timeout\"}"
        values: "0x9 0+2x20 40x30"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweLockTimeoutsFrequent"
        exp_alerts: []
      - eval_time: "28m"
        alertname: "KumweLockTimeoutsFrequent"
        exp_alerts:
          - exp_labels:
              component: "database"
              severity: "ticket"
            exp_annotations:
              summary: "Kumwe transactions are timing out waiting for locks."
              description: "A long transaction or an operator session is holding rows that the application needs. The diagnostics surface and the server's lock views name the holder."
              runbook: "docs/operations/runbooks.md#kumwelocktimeoutsfrequent"
              caught: "A manual reporting query left open in an administrator's database client over lunch, which held a range lock on the job table and stalled every claim behind it."
      - eval_time: "45m"
        alertname: "KumweLockTimeoutsFrequent"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_transactions_total{instance=\"app-1:9000\",job=\"kumwe\",outcome=\"committed\"}"
        values: "0+100x70"
      - series: "kumwe_transactions_total{instance=\"app-1:9000\",job=\"kumwe\",outcome=\"rolled_back\"}"
        values: "0x9 0+20x25 500x35"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweTransactionRollbackRateHigh"
        exp_alerts: []
      - eval_time: "32m"
        alertname: "KumweTransactionRollbackRateHigh"
        exp_alerts:
          - exp_labels:
              component: "database"
              severity: "ticket"
            exp_annotations:
              summary: "More than 5% of Kumwe transactions are rolling back."
              description: "Rollbacks are the transport cost of conflicts, refusals and retries. A sustained rate this high means work is being done twice; compare with the deadlock, lock-timeout and retry signals to find which."
              runbook: "docs/operations/runbooks.md#kumwetransactionrollbackratehigh"
              caught: "An optimistic-concurrency check that every concurrent edit of a popular record failed, which users saw only as an occasional \"please retry\"."
      - eval_time: "58m"
        alertname: "KumweTransactionRollbackRateHigh"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_workers_registered{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "1x9 0x20 1x20"
      - series: "kumwe_worker_heartbeat_age_seconds{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "5x9 0x20 5x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweNoLiveWorker"
        exp_alerts: []
      - eval_time: "20m"
        alertname: "KumweNoLiveWorker"
        exp_alerts:
          - exp_labels:
              component: "queue"
              severity: "page"
            exp_annotations:
              summary: "No Kumwe worker is alive."
              description: "Either no worker has a heartbeat row at all — a worker that shut down cleanly removes its own — or the freshest heartbeat is over five minutes old. Scheduled jobs, retention drains and exports are stopped. Check the worker container before the queue depth."
              runbook: "docs/operations/runbooks.md#kumwenoliveworker"
              caught: "A worker container that drained cleanly on a stale runtime generation and was not restarted, which left no heartbeat row behind and so could never trip an age threshold alone."
      - eval_time: "35m"
        alertname: "KumweNoLiveWorker"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_jobs_oldest_due_age_seconds{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "0x9 1000+60x20 0x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweJobQueueStalled"
        exp_alerts: []
      - eval_time: "25m"
        alertname: "KumweJobQueueStalled"
        exp_alerts:
          - exp_labels:
              component: "queue"
              severity: "ticket"
            exp_annotations:
              summary: "The oldest due Kumwe job has been waiting more than 15 minutes."
              description: "Workers are alive (the worker page would otherwise inhibit this) but not claiming this work: one job type is failing and re-queueing ahead of everything else, or a queue has no worker assigned."
              runbook: "docs/operations/runbooks.md#kumwejobqueuestalled"
              caught: "A poison job whose handler raised before settling, holding the head of the queue through every retry while later jobs waited behind it."
      - eval_time: "35m"
        alertname: "KumweJobQueueStalled"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_jobs_lease_expired{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "0x9 2x25 0x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweJobLeasesExpiring"
        exp_alerts: []
      - eval_time: "30m"
        alertname: "KumweJobLeasesExpiring"
        exp_alerts:
          - exp_labels:
              component: "queue"
              severity: "ticket"
            exp_annotations:
              summary: "Kumwe jobs are holding expired worker leases."
              description: "A claimed job whose lease expired without settlement means the worker died mid-execution or the handler outran its lease. The job is recoverable; a steady count means it is happening repeatedly."
              runbook: "docs/operations/runbooks.md#kumwejobleasesexpiring"
              caught: "A handler whose runtime grew past its lease after a data-volume increase, which silently produced duplicated side effects on every retry."
      - eval_time: "40m"
        alertname: "KumweJobLeasesExpiring"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_jobs_dead_lettered{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "0x9 1x15 0x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweJobsDeadLettered"
        exp_alerts: []
      - eval_time: "20m"
        alertname: "KumweJobsDeadLettered"
        exp_alerts:
          - exp_labels:
              component: "queue"
              severity: "ticket"
            exp_annotations:
              summary: "Kumwe jobs are sitting in the failed-job ledger."
              description: "A dead-lettered job has exhausted its attempts and will not run again without an operator. Nothing recovers this on its own; retrying or discarding the job clears the ledger row and this alert."
              runbook: "docs/operations/runbooks.md#kumwejobsdeadlettered"
              caught: "A scheduled export job failing permanently on a retired site, which no other signal reported because the queue drained normally."
      - eval_time: "30m"
        alertname: "KumweJobsDeadLettered"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_queue_settlements_total{instance=\"app-1:9000\",job=\"kumwe\",outcome=\"completed\"}"
        values: "0+10x70"
      - series: "kumwe_queue_settlements_total{instance=\"app-1:9000\",job=\"kumwe\",outcome=\"retried\"}"
        values: "0x9 0+10x25 250x35"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweJobRetryRateHigh"
        exp_alerts: []
      - eval_time: "32m"
        alertname: "KumweJobRetryRateHigh"
        exp_alerts:
          - exp_labels:
              component: "queue"
              severity: "ticket"
            exp_annotations:
              summary: "More than a quarter of Kumwe job attempts end in a retry."
              description: "Retries are transport cost, not business progress: the business dashboard's completed-job rate hides them. A rate this high means a dependency is failing transiently and work is being paid for repeatedly."
              runbook: "docs/operations/runbooks.md#kumwejobretryratehigh"
              caught: "A mail relay rate-limiting the notification job, which completed every job eventually and so never dead-lettered, while tripling worker load."
      - eval_time: "58m"
        alertname: "KumweJobRetryRateHigh"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_scheduler_lag_seconds{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "0x9 400x20 0x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweSchedulerLagging"
        exp_alerts: []
      - eval_time: "25m"
        alertname: "KumweSchedulerLagging"
        exp_alerts:
          - exp_labels:
              component: "queue"
              severity: "ticket"
            exp_annotations:
              summary: "A Kumwe schedule is more than 5 minutes past its next run time."
              description: "The scheduler is not dispatching. Backups, audit-trail verification and retention all ride on schedules, so this silently disables several controls at once."
              runbook: "docs/operations/runbooks.md#kumweschedulerlagging"
              caught: "A scheduler container stopped during a deploy and never restarted, which stopped the nightly audit.trail.verify job — the exact control that is supposed to notice tampering."
      - eval_time: "35m"
        alertname: "KumweSchedulerLagging"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_outbox_oldest_pending_age_seconds{instance=\"app-1:9000\",job=\"kumwe\"}"
        values: "0x9 400x20 0x20"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "KumweOutboxBacklogAging"
        exp_alerts: []
      - eval_time: "25m"
        alertname: "KumweOutboxBacklogAging"
        exp_alerts:
          - exp_labels:
              component: "integration"
              severity: "ticket"
            exp_annotations:
              summary: "The oldest undispatched Kumwe integration event is more than 5 minutes old."
              description: "Events are durable, so nothing is lost, but downstream systems are working from stale data. Distinguish transport backpressure from transport failure in the log before escalating."
              runbook: "docs/operations/runbooks.md#kumweoutboxbacklogaging"
              caught: "A downstream endpoint answering slowly rather than failing, which produced no errors at all and would have gone unnoticed until a partner asked why their data was hours behind."
      - eval_time: "35m"
        alertname: "KumweOutboxBacklogAging"
        exp_alerts: []
  - interval: "1m"
    input_series:
      - series: "kumwe_outbox_dead{instance=\"app-1:9000\",job=\"kumwe\"}"
