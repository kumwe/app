# Kumwe alerting rules, in Prometheus rule format.
#
# Load this alongside a scrape job named `kumwe` for the `/metrics` endpoint that
# `src/Http/Handler/MetricsHandler.php` serves, and alongside the synthetic probe's textfile output
# (`tools/synthetic-probe.php`, see docs/operations/monitoring.md#synthetic-probes). Every rule here is written
# against a metric Kumwe emits or the probe writes — nothing in this file needs an exporter, a sidecar, or a
# query against the application database. Merge `alertmanager.yaml` beside it into your Alertmanager
# configuration for the inhibition rules, and import the dashboards under `dashboards/`.
#
# Conventions, enforced by `composer observability:rules` (tools/verify-alert-rules.php) and, in CI, by
# `promtool check rules`, `promtool test rules` over `tests/alerts.test.yaml`, `amtool check-config` and the
# alert drills (`tools/alert-drill.php`):
#
#   * every alert carries `severity` (`page` wakes someone, `ticket` will be worse tomorrow but not tonight)
#     and `component`, and nothing else, so routing and inhibition have a closed vocabulary;
#   * every alert names the runbook section that says what to do about it and states, in `caught`, the
#     concrete failure it would have caught — an alert nobody can act on trains a rotation to ignore pages;
#   * the durable gauges (queues, outbox, inbox, retention, recovery) read the same database from every
#     replica, so their rules aggregate with `max()` and fire once per installation, not once per replica;
#     per-process signals (scrape, readiness, trust, storage) keep `instance` so the page names the replica;
#   * annotation templates reference only `$labels` that survive the expression, never `$value` formatting.
#
# Thresholds are starting points chosen to sit above normal operation and below user-visible damage. Tune
# `for` durations before thresholds: most false pages come from a scrape gap, not a genuinely wrong number.

groups:
  - name: kumwe.availability
    rules:
      - alert: KumweScrapeTargetDown
        expr: up{job="kumwe"} == 0
        for: 5m
        labels:
          severity: page
          component: availability
        annotations:
          summary: "Kumwe replica {{ $labels.instance }} is not answering scrapes."
          description: >-
            The metrics endpoint has not answered for five minutes. Confirm the process is alive with
            GET /health/live before treating this as an application fault: a scrape failure alone can also mean
            the scrape credential or the network path changed.
          runbook: docs/operations/runbooks.md#kumwescrapetargetdown
          caught: >-
            A replica that PHP-FPM stopped accepting connections on while its container kept passing its own
            liveness check, which the health probes alone would have reported as healthy.

      - alert: KumweReadinessFailing
        expr: max_over_time(kumwe_ready[5m]) == 0
        for: 5m
        labels:
          severity: page
          component: availability
        annotations:
          summary: "Kumwe replica {{ $labels.instance }} has reported itself unfit for traffic for 5 minutes."
          description: >-
            The replica's signed runtime marker is missing, stale or disagrees with the published generation, so
            the load balancer is draining it. A brief failure during a deploy is expected; five sustained minutes
            is not.
          runbook: docs/operations/runbooks.md#kumwereadinessfailing
          caught: >-
            A replica left behind at an older extension runtime generation after an activation, which would
            otherwise have kept serving pages rendered from the wrong extension set.

      - alert: KumweSyntheticProbeFailing
        expr: min by (check) (kumwe_probe_success) == 0
        for: 5m
        labels:
          severity: page
          component: availability
        annotations:
          summary: "The Kumwe synthetic probe check {{ $labels.check }} is failing."
          description: >-
            The probe exercises the deployment the way a visitor and a monitoring client do, from outside the
            process. A failing check with every internal signal green points at the ingress, TLS, DNS or the
            trusted-host configuration rather than at the application.
          runbook: docs/operations/runbooks.md#kumwesyntheticprobefailing
          caught: >-
            A certificate renewal that left the ingress serving the old chain, which every in-cluster check
            reached around and only an external request could see.

      - alert: KumweSyntheticProbeStale
        expr: time() - max(kumwe_probe_last_run_timestamp_seconds) > 900
        for: 5m
        labels:
          severity: ticket
          component: observability
        annotations:
          summary: "The Kumwe synthetic probe has not reported for 15 minutes."
          description: >-
            The probe's schedule stopped or its textfile is no longer collected, so the availability page above
            cannot fire. Restore the probe before trusting a quiet pager.
          runbook: docs/operations/runbooks.md#kumwesyntheticprobestale
          caught: >-
            A cron entry removed during a host rebuild, which silently disabled the only check that exercised
            the public ingress.

      - alert: KumweReleaseSkew
        expr: count(count by (release) (kumwe_build_info)) > 1
        for: 30m
        labels:
          severity: ticket
          component: availability
        annotations:
          summary: "More than one Kumwe release is serving traffic."
          description: >-
            Two releases have been answering scrapes for half an hour. A rolling deploy passes through this state
            briefly; staying in it means a replica did not restart or a rollback stalled part-way.
          runbook: docs/operations/runbooks.md#kumwereleaseskew
          caught: >-
            A deploy where one worker container failed its pull and silently kept running the previous release,
            producing intermittent behaviour that no single replica's logs explained.

  - name: kumwe.http
    rules:
      - alert: KumweServerErrorRateElevated
        expr: >-
          sum(rate(kumwe_http_requests_total{status="5xx"}[5m]))
          /
          clamp_min(sum(rate(kumwe_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: ticket
          component: http
        annotations:
          summary: "More than 2% of Kumwe responses are server errors."
          description: >-
            Sustained above the level a healthy installation reaches from isolated faults. Correlate with the log
            stream on outcome=failure and the request identifier before restarting anything.
          runbook: docs/operations/runbooks.md#kumweservererrorrateelevated
          caught: >-
            A misconfigured trusted-host list after a domain change, which returned 5xx to a fraction of traffic
            while every health probe stayed green.

      - alert: KumweServerErrorRateCritical
        expr: >-
          sum(rate(kumwe_http_requests_total{status="5xx"}[5m]))
          /
          clamp_min(sum(rate(kumwe_http_requests_total[5m])), 0.001) > 0.10
        for: 5m
        labels:
          severity: page
          component: http
        annotations:
          summary: "More than 10% of Kumwe responses are server errors."
          description: >-
            One request in ten is failing. Treat as an outage. Check readiness and the database first; the error
            boundary logs every unhandled exception with its request identifier.
          runbook: docs/operations/runbooks.md#kumweservererrorratecritical
          caught: >-
            A database credential rotation applied to the secret store but not to the running containers, which
            readiness reported only after the connection pool had already started failing requests.

      - alert: KumweRequestLatencyHigh
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(kumwe_http_request_duration_seconds_bucket[10m]))) > 2
        for: 15m
        labels:
          severity: ticket
          component: http
        annotations:
          summary: "Kumwe 95th-percentile request duration is above 2 seconds."
          description: >-
            Latency this far above normal usually means database contention, a cold template cache after a
            deploy, or a saturated worker pool. Check the lock and connection signals before the application.
          runbook: docs/operations/runbooks.md#kumwerequestlatencyhigh
          caught: >-
            A missing index after a business-schema plan executed, which showed up as slow pages long before it
            showed up as an error.

      - alert: KumweDocumentCommitLatencyHigh
        expr: >-
          histogram_quantile(0.95, sum by (le, operation_class)
          (rate(kumwe_operation_duration_seconds_bucket{operation_class=~"document_100_line_commit|document_1000_line_commit"}[15m])))
          > 5
        for: 15m
        labels:
          severity: ticket
          component: http
        annotations:
          summary: "Kumwe {{ $labels.operation_class }} is taking more than 5 seconds at the 95th percentile."
          description: >-
            Business documents are committing far outside the capacity contract's objective. This is the
            business-operation view of latency: it excludes transport retries and measures the whole command.
          runbook: docs/operations/runbooks.md#kumwedocumentcommitlatencyhigh
          caught: >-
            A sequence allocation that serialized every document behind one hot row, which kept request latency
            acceptable on average while every large document stalled.

  - name: kumwe.database
    rules:
      - alert: KumweDatabaseConnectionsSaturated
        expr: max(kumwe_database_connections_in_use / clamp_min(kumwe_database_connections_max, 1)) > 0.9
        for: 10m
        labels:
          severity: ticket
          component: database
        annotations:
          summary: "The Kumwe database is above 90% of its connection ceiling."
          description: >-
            New PHP-FPM children and workers will soon be refused a session. Check for leaked long-running
            sessions and for a worker pool scaled past what the server allows before raising the ceiling.
          runbook: docs/operations/runbooks.md#kumwedatabaseconnectionssaturated
          caught: >-
            A worker scale-out from 4 to 40 replicas that left no connection headroom for the web tier, which
            failed requests with a driver error long before CPU or memory looked unusual.

      - alert: KumweDatabaseReplicaLagHigh
        expr: max(kumwe_database_replica_lag_seconds) > 60
        for: 10m
        labels:
          severity: ticket
          component: database
        annotations:
          summary: "A Kumwe database replica is more than a minute behind its source."
          description: >-
            Reads routed to the replica are stale, and a failover now would lose the unreplicated tail. The
            gauge reads zero where the account may not inspect replication, so confirm on the server itself.
          runbook: docs/operations/runbooks.md#kumwedatabasereplicalaghigh
          caught: >-
            A replica whose disk filled, which stopped applying the log without breaking replication, and would
            have been promoted during the next maintenance window with an hour of writes missing.

      - alert: KumweDeadlocksFrequent
        expr: sum(increase(kumwe_transaction_failures_total{class="deadlock"}[10m])) > 5
        for: 10m
        labels:
          severity: ticket
          component: database
        annotations:
          summary: "Kumwe transactions are deadlocking repeatedly."
          description: >-
            More than five deadlocks in ten minutes. Each one was rolled back and, where the caller retries, paid
            for twice. Two write paths are taking the same rows in opposite orders.
          runbook: docs/operations/runbooks.md#kumwedeadlocksfrequent
          caught: >-
            An extension handler that updated a document header before its lines while the core path did the
            reverse, which only deadlocked under concurrent edits of the same document.

      - alert: KumweLockTimeoutsFrequent
        expr: sum(increase(kumwe_transaction_failures_total{class="lock_timeout"}[10m])) > 5
        for: 10m
        labels:
          severity: ticket
          component: database
        annotations:
          summary: "Kumwe transactions are timing out waiting for locks."
          description: >-
            A long transaction or an operator session is holding rows that the application needs. The diagnostics
            surface and the server's lock views name the holder.
          runbook: docs/operations/runbooks.md#kumwelocktimeoutsfrequent
          caught: >-
            A manual reporting query left open in an administrator's database client over lunch, which held a
            range lock on the job table and stalled every claim behind it.

      - alert: KumweTransactionRollbackRateHigh
        expr: >-
          sum(rate(kumwe_transactions_total{outcome="rolled_back"}[15m]))
          /
          clamp_min(sum(rate(kumwe_transactions_total[15m])), 0.001) > 0.05
        for: 15m
        labels:
          severity: ticket
          component: database
        annotations:
          summary: "More than 5% of Kumwe transactions are rolling back."
          description: >-
            Rollbacks are the transport cost of conflicts, refusals and retries. A sustained rate this high means
            work is being done twice; compare with the deadlock, lock-timeout and retry signals to find which.
          runbook: docs/operations/runbooks.md#kumwetransactionrollbackratehigh
          caught: >-
            An optimistic-concurrency check that every concurrent edit of a popular record failed, which users saw
            only as an occasional "please retry".

  - name: kumwe.queues
    rules:
      - alert: KumweNoLiveWorker
        expr: >-
          (max(kumwe_workers_registered) == 0)
          or
          (max(kumwe_worker_heartbeat_age_seconds) > 300)
        for: 5m
        labels:
          severity: page
          component: queue
        annotations:
          summary: "No Kumwe worker is alive."
          description: >-
            Either no worker has a heartbeat row at all — a worker that shut down cleanly removes its own — or the
            freshest heartbeat is over five minutes old. Scheduled jobs, retention drains and exports are stopped.
            Check the worker container before the queue depth.
          runbook: docs/operations/runbooks.md#kumwenoliveworker
          caught: >-
            A worker container that drained cleanly on a stale runtime generation and was not restarted, which
            left no heartbeat row behind and so could never trip an age threshold alone.

      - alert: KumweJobQueueStalled
        expr: max(kumwe_jobs_oldest_due_age_seconds) > 900
        for: 10m
        labels:
          severity: ticket
          component: queue
        annotations:
          summary: "The oldest due Kumwe job has been waiting more than 15 minutes."
          description: >-
            Workers are alive (the worker page would otherwise inhibit this) but not claiming this work: one job
            type is failing and re-queueing ahead of everything else, or a queue has no worker assigned.
          runbook: docs/operations/runbooks.md#kumwejobqueuestalled
          caught: >-
            A poison job whose handler raised before settling, holding the head of the queue through every retry
            while later jobs waited behind it.

      - alert: KumweJobLeasesExpiring
        expr: max(kumwe_jobs_lease_expired) > 0
        for: 15m
        labels:
          severity: ticket
          component: queue
        annotations:
          summary: "Kumwe jobs are holding expired worker leases."
          description: >-
            A claimed job whose lease expired without settlement means the worker died mid-execution or the
            handler outran its lease. The job is recoverable; a steady count means it is happening repeatedly.
          runbook: docs/operations/runbooks.md#kumwejobleasesexpiring
          caught: >-
            A handler whose runtime grew past its lease after a data-volume increase, which silently produced
            duplicated side effects on every retry.

      - alert: KumweJobsDeadLettered
        expr: max(kumwe_jobs_dead_lettered) > 0
        for: 5m
        labels:
          severity: ticket
          component: queue
        annotations:
          summary: "Kumwe jobs are sitting in the failed-job ledger."
          description: >-
            A dead-lettered job has exhausted its attempts and will not run again without an operator. Nothing
            recovers this on its own; retrying or discarding the job clears the ledger row and this alert.
          runbook: docs/operations/runbooks.md#kumwejobsdeadlettered
          caught: >-
            A scheduled export job failing permanently on a retired site, which no other signal reported because
            the queue drained normally.

      - alert: KumweJobRetryRateHigh
        expr: >-
          sum(rate(kumwe_queue_settlements_total{outcome="retried"}[15m]))
          /
          clamp_min(sum(rate(kumwe_queue_settlements_total[15m])), 0.001) > 0.25
        for: 15m
        labels:
          severity: ticket
          component: queue
        annotations:
          summary: "More than a quarter of Kumwe job attempts end in a retry."
          description: >-
            Retries are transport cost, not business progress: the business dashboard's completed-job rate hides
            them. A rate this high means a dependency is failing transiently and work is being paid for repeatedly.
          runbook: docs/operations/runbooks.md#kumwejobretryratehigh
          caught: >-
            A mail relay rate-limiting the notification job, which completed every job eventually and so never
            dead-lettered, while tripling worker load.

      - alert: KumweSchedulerLagging
        expr: max(kumwe_scheduler_lag_seconds) > 300
        for: 10m
        labels:
          severity: ticket
          component: queue
        annotations:
          summary: "A Kumwe schedule is more than 5 minutes past its next run time."
          description: >-
            The scheduler is not dispatching. Backups, audit-trail verification and retention all ride on
            schedules, so this silently disables several controls at once.
          runbook: docs/operations/runbooks.md#kumweschedulerlagging
          caught: >-
            A scheduler container stopped during a deploy and never restarted, which stopped the nightly
            audit.trail.verify job — the exact control that is supposed to notice tampering.

  - name: kumwe.integrations
    rules:
      - alert: KumweOutboxBacklogAging
        expr: max(kumwe_outbox_oldest_pending_age_seconds) > 300
        for: 10m
        labels:
          severity: ticket
          component: integration
        annotations:
          summary: "The oldest undispatched Kumwe integration event is more than 5 minutes old."
          description: >-
            Events are durable, so nothing is lost, but downstream systems are working from stale data.
            Distinguish transport backpressure from transport failure in the log before escalating.
          runbook: docs/operations/runbooks.md#kumweoutboxbacklogaging
          caught: >-
            A downstream endpoint answering slowly rather than failing, which produced no errors at all and would
            have gone unnoticed until a partner asked why their data was hours behind.

      - alert: KumweOutboxDeadLetters
        expr: max(kumwe_outbox_dead) > 0
        for: 15m
        labels:
          severity: ticket
          component: integration
        annotations:
          summary: "Kumwe integration events have exhausted their delivery attempts."
          description: >-
            These events will never be delivered without an operator replaying them. Replay is audited and
            available through the integration operations surface.
          runbook: docs/operations/runbooks.md#kumweoutboxdeadletters
          caught: >-
            A contract change on the receiving side that made every event of one type permanently undeliverable,
            while every other event type kept flowing normally.

      - alert: KumweDispatchRetryRateHigh
        expr: >-
          sum(rate(kumwe_dispatch_settlements_total{outcome="retried"}[15m]))
          /
          clamp_min(sum(rate(kumwe_dispatch_settlements_total[15m])), 0.001) > 0.25
        for: 15m
        labels:
          severity: ticket
          component: integration
        annotations:
          summary: "More than a quarter of Kumwe outbox dispatch attempts end in a retry."
          description: >-
            The transport is failing transiently. Events still arrive, which is why the business dashboard looks
            healthy; the transport dashboard shows what it costs.
          runbook: docs/operations/runbooks.md#kumwedispatchretryratehigh
          caught: >-
            A partner endpoint answering 503 to every other request behind a flapping load balancer, which
            doubled delivery latency without a single dead letter.

      - alert: KumweInboxBacklogAging
        expr: max(kumwe_inbox_oldest_pending_age_seconds) > 600
        for: 10m
        labels:
          severity: ticket
          component: integration
        annotations:
          summary: "The oldest unconsumed Kumwe inbox receipt is more than 10 minutes old."
          description: >-
            A consumer is behind or blocked. Consumers are independent, so one blocked consumer holds only its own
            receipts; the inbox operations view names which one.
          runbook: docs/operations/runbooks.md#kumweinboxbacklogaging
          caught: >-
            A consumer circuit held open by a partner outage long after the partner recovered, because the
            consumer's own retry budget was spent in the first minutes of the outage.

      - alert: KumweInboxPoison
        expr: max(kumwe_inbox_poison) > 0
        for: 15m
        labels:
          severity: ticket
          component: integration
        annotations:
          summary: "Kumwe has quarantined inbound integration events as poison."
          description: >-
            A consumer refused an event repeatedly and it has been set aside rather than retried forever. The
            event is preserved; only a signed handler revision frees it.
          runbook: docs/operations/runbooks.md#kumweinboxpoison
          caught: >-
            A handler-version upgrade that could not read events produced by the previous schema version, which
            stalled one consumer's checkpoint without affecting any other consumer.

      - alert: KumweProcessWorkOverdue
        expr: max(kumwe_process_work_oldest_overdue_age_seconds) > 900
        for: 15m
        labels:
          severity: ticket
          component: integration
        annotations:
          summary: "A Kumwe long-running process has work more than 15 minutes past due."
          description: >-
            Timers, commands and compensations all live here. An overdue compensation is the serious case: a
            process that already failed has not finished unwinding.
          runbook: docs/operations/runbooks.md#kumweprocessworkoverdue
          caught: >-
            A compensation step whose handler was removed by an extension being disabled, leaving business
            processes half-rolled-back with no error anywhere in the request path.

      - alert: KumweProjectionSequencingStalled
        expr: max(kumwe_projection_staging_oldest_age_seconds) > 300
        for: 10m
        labels:
          severity: ticket
          component: integration
        annotations:
          summary: "Committed Kumwe events have waited more than 5 minutes for a journal sequence."
          description: >-
            Nothing dispatches or projects an event until it is sequenced, so reports and every outbound
            integration are frozen at the last sequenced point.
          runbook: docs/operations/runbooks.md#kumweprojectionsequencingstalled
          caught: >-
            An integration worker left running an older release whose sequencer could not read a new staging
            column, which failed every pass quietly while the outbox gauge still showed rows waiting.

  - name: kumwe.reporting
    rules:
      - alert: KumweExportQueueBacklog
        expr: max(kumwe_export_queue_depth) > 25
        for: 30m
        labels:
          severity: ticket
          component: reporting
        annotations:
          summary: "Kumwe report exports are queueing faster than they complete."
          description: >-
            Export artifacts are produced by queued jobs, so check the job queue signals first — a backlog here is
            usually a worker problem rather than a reporting problem.
          runbook: docs/operations/runbooks.md#kumweexportqueuebacklog
          caught: >-
            An export job type whose handler stopped being registered after an extension upgrade, which left users
            watching exports that never arrived and produced no failing request.

      - alert: KumweExpiredExportsRetained
        expr: max(kumwe_export_artifacts_expired) > 0
        for: 1h
        labels:
          severity: ticket
          component: reporting
        annotations:
          summary: "Kumwe is still storing report export artifacts past their expiry."
          description: >-
            Expiry is enforced by a scheduled drain. Artifacts outliving it means the drain is not running, which
            is a data-retention problem rather than an availability one.
          runbook: docs/operations/runbooks.md#kumweexpiredexportsretained
          caught: >-
            A disabled retention schedule that kept generated business reports — including their row contents —
            on disk indefinitely, well past the window the site's retention policy allowed.

  - name: kumwe.retention
    rules:
      - alert: KumweRetentionBacklogStale
        expr: max by (store) (kumwe_retention_oldest_age_seconds) > 21600
        for: 30m
        labels:
          severity: ticket
          component: retention
        annotations:
          summary: "Kumwe store {{ $labels.store }} has held drainable rows for more than 6 hours."
          description: >-
            Rows past their retention window are not being removed. The drain schedule is disabled, its jobs are
            failing, or it runs but cannot keep up; the retention runs ledger and the drain log lines say which.
          runbook: docs/operations/runbooks.md#kumweretentionbacklogstale
          caught: >-
            An idempotency ledger that grew by millions of rows a week after its drain schedule was disabled
            during a migration and never re-enabled, until claim lookups slowed every write.

      - alert: KumweRetentionCapacityForecast
        expr: min by (store) (kumwe_retention_forecast_seconds_to_capacity) < 259200
        for: 1h
        labels:
          severity: ticket
          component: retention
        annotations:
          summary: "Kumwe store {{ $labels.store }} is forecast to reach capacity within 3 days."
          description: >-
            Ingest is outpacing the drain at the current slope. Raise the drain budget or shorten the window
            before the store reaches the size the capacity contract was measured at.
          runbook: docs/operations/runbooks.md#kumweretentioncapacityforecast
          caught: >-
            A launch-day traffic spike that tripled outbox ingest, which the default drain budget would have
            fallen behind on for a week before anyone looked at the table sizes.

      - alert: KumweRetentionReadinessFailed
        expr: max(kumwe_retention_readiness) >= 2
        for: 15m
        labels:
          severity: ticket
          component: retention
        annotations:
          summary: "Kumwe retention readiness reports a failed verdict."
          description: >-
            An enterprise-profile installation is missing a retention setting it declared it needs. Nothing is
            being deleted wrongly; something that must be deleted is not configured to be.
          runbook: docs/operations/runbooks.md#kumweretentionreadinessfailed
          caught: >-
            An enterprise installation restored from a backup taken before audit retention was configured, which
            quietly returned the audit trail to unbounded growth.

  - name: kumwe.recovery
    rules:
      - alert: KumweBackupStale
        expr: time() - max(kumwe_recovery_last_success_timestamp_seconds{operation="backup"}) > 10800
        for: 15m
        labels:
          severity: page
          component: recovery
        annotations:
          summary: "No Kumwe backup has succeeded for more than 3 hours."
          description: >-
            The declared recovery point is the backup interval (60 minutes); three hours means at least two
            scheduled cycles did not produce a recorded snapshot. A value of zero means no backup was ever
            recorded, which is treated as older than any threshold.
          runbook: docs/operations/runbooks.md#kumwebackupstale
          caught: >-
            A backup timer whose quiesce hook began failing after a credential rotation, which left the last good
            snapshot nine days old when a restore was finally needed.

      - alert: KumweBackupFailing
        expr: >-
          max(kumwe_recovery_last_failure_timestamp_seconds{operation="backup"})
          >
          max(kumwe_recovery_last_success_timestamp_seconds{operation="backup"})
        for: 5m
        labels:
          severity: ticket
          component: recovery
        annotations:
          summary: "The latest Kumwe backup attempt failed."
          description: >-
            The most recent backup cycle recorded a failure after the last success: a snapshot, its verification
            or its offsite copy did not complete. The next successful cycle clears this.
          runbook: docs/operations/runbooks.md#kumwebackupfailing
          caught: >-
            An offsite bucket whose credentials expired, which let local snapshots keep succeeding while no copy
            ever left the host.

      - alert: KumweRestoreFailed
        expr: >-
          max by (operation) (kumwe_recovery_last_failure_timestamp_seconds{operation=~"restore|restore_verify"})
          >
          max by (operation) (kumwe_recovery_last_success_timestamp_seconds{operation=~"restore|restore_verify"})
        for: 1m
        labels:
          severity: page
          component: recovery
        annotations:
          summary: "The latest Kumwe {{ $labels.operation }} failed."
          description: >-
            Either a restore stopped part-way, or the verification every backup cycle runs refused a snapshot.
            In both cases the snapshots you are relying on may not restore. Nothing was published by a failed
            restore; its targets are left for inspection.
          runbook: docs/operations/runbooks.md#kumwerestorefailed
          caught: >-
            A backup whose checksum inventory no longer matched its payload after a storage-layer bit flip, which
            only a verification run would have found before the day it was needed.

  - name: kumwe.storage
    rules:
      - alert: KumweStorageNearlyFull
        expr: kumwe_storage_free_bytes / kumwe_storage_capacity_bytes < 0.05
        for: 10m
        labels:
          severity: page
          component: storage
        annotations:
          summary: "Kumwe {{ $labels.volume }} storage on {{ $labels.instance }} has less than 5% free."
          description: >-
            Uploads, report exports and audit archives will start failing with a typed storage error. Free space
            or grow the volume now; the application publishes nothing partial when a write is refused.
          runbook: docs/operations/runbooks.md#kumwestoragenearlyfull
          caught: >-
            A private-data volume filled by report exports whose expiry drain was disabled, which failed every
            new export while the site itself stayed up.

      - alert: KumweStorageWillFillSoon
        expr: >-
          predict_linear(kumwe_storage_free_bytes[6h], 86400) < 0
          and
          kumwe_storage_free_bytes / kumwe_storage_capacity_bytes < 0.40
        for: 30m
        labels:
          severity: ticket
          component: storage
        annotations:
          summary: "Kumwe {{ $labels.volume }} storage on {{ $labels.instance }} is forecast to fill within a day."
          description: >-
            At the last six hours' rate the volume runs out of space within 24 hours. This is the disk forecast:
            act on it during working hours so the nearly-full page never fires.
          runbook: docs/operations/runbooks.md#kumwestoragewillfillsoon
          caught: >-
            A media import job writing duplicate originals on every retry, which consumed a quarter of the volume
            overnight at a steady rate.

  - name: kumwe.extensions
    rules:
      - alert: KumweExtensionRuntimeUntrusted
        expr: kumwe_extension_runtime_trusted == 0
        for: 5m
        labels:
          severity: page
          component: extension
        annotations:
          summary: "Kumwe replica {{ $labels.instance }} is not serving a trusted extension runtime."
          description: >-
            The replica's compiled extension runtime is missing, unsigned or failed verification, so installed
            extensions are not loaded there. Materialize the trusted generation again; never switch trust off.
          runbook: docs/operations/runbooks.md#kumweextensionruntimeuntrusted
          caught: >-
            A replica restored from an image whose runtime signing key did not match the installation's, which
            served the site without any of its extensions for a morning.

      - alert: KumweRevocationFeedStale
        expr: max(kumwe_extension_revocation_feed_stale) == 1
        for: 30m
        labels:
          severity: ticket
          component: extension
        annotations:
          summary: "The Kumwe extension key revocation feed is stale."
          description: >-
            The installation cannot learn that a signing key was revoked. Keys already trusted stay trusted
            until the feed is reachable again.
          runbook: docs/operations/runbooks.md#kumwerevocationfeedstale
          caught: >-
            An egress policy change that blocked the revocation feed's host, during the week a compromised vendor
            key was revoked.

  - name: kumwe.security
    rules:
      - alert: KumweAuthenticationFailureBurst
        expr: sum(increase(kumwe_security_events_total{event="authentication_failed"}[10m])) > 50
        for: 2m
        labels:
          severity: page
          component: security
        annotations:
          summary: "More than 50 Kumwe sign-in attempts failed in ten minutes."
          description: >-
            A credential-stuffing or password-spraying run is the usual cause. The attempt budget is throttling
            each account and origin pair; confirm the source in the log lines and block it at the ingress.
          runbook: docs/operations/runbooks.md#kumweauthenticationfailureburst
          caught: >-
            A spraying run from a rotating residential proxy pool that stayed under every per-origin throttle
            while trying one password against every administrator account.

      - alert: KumweAuthenticationThrottling
        expr: sum(increase(kumwe_security_events_total{event="authentication_throttled"}[10m])) > 10
        for: 5m
        labels:
          severity: ticket
          component: security
        annotations:
          summary: "Kumwe is throttling sign-in attempts."
          description: >-
            Account and origin pairs have spent their attempt budget. A single user locked out after a password
            change looks the same as an attack from one origin; the log lines tell them apart.
          runbook: docs/operations/runbooks.md#kumweauthenticationthrottling
          caught: >-
            A monitoring integration configured with an old password, which locked the operations account out of
            the administrator every time it polled.

      - alert: KumweTokenRejectionBurst
        expr: sum(increase(kumwe_security_events_total{event="token_rejected"}[10m])) > 50
        for: 5m
        labels:
          severity: ticket
          component: security
        annotations:
          summary: "Kumwe is rejecting bearer tokens at an unusual rate."
          description: >-
            An integration is presenting a revoked or expired token, or someone is guessing. The REST, console and
            MCP surfaces all count here.
          runbook: docs/operations/runbooks.md#kumwetokenrejectionburst
          caught: >-
            A partner's deployment that kept calling the API with a token revoked during an incident, which the
            partner reported as an outage of ours.

      - alert: KumwePermissionDenialBurst
        expr: sum(increase(kumwe_security_events_total{event="permission_denied"}[10m])) > 200
        for: 5m
        labels:
          severity: ticket
          component: security
        annotations:
          summary: "Kumwe is denying an unusual number of authorization decisions."
          description: >-
            Either a principal is probing resources it may not reach, or a grant was removed that a legitimate
            integration still depends on. Every denial is logged with its subject, action and resource.
          runbook: docs/operations/runbooks.md#kumwepermissiondenialburst
          caught: >-
            A support account whose portal session was used to enumerate record identifiers across sites, which
            every individual request's 403 made look harmless.

  - name: kumwe.observability
    rules:
      - alert: KumweMetricsCollectionFailing
        expr: max(kumwe_metrics_collection_failed) == 1
        for: 10m
        labels:
          severity: ticket
          component: observability
        annotations:
          summary: "Kumwe is serving metrics but cannot read its own durable gauges."
          description: >-
            The endpoint is answering, so the process is fine, but the queue, outbox, retention and recovery
            gauges are stale or absent. The inhibition rules mute the alerts that read them until this clears.
          runbook: docs/operations/runbooks.md#kumwemetricscollectionfailing
          caught: >-
            A least-privilege database account that had been granted rights on the application tables but not on
            the newer integration tables, which made half the alerting silently blind.

      - alert: KumweMetricsScrapeSlow
        expr: max(kumwe_metrics_scrape_duration_seconds) > 2
        for: 15m
        labels:
          severity: ticket
          component: observability
        annotations:
          summary: "Collecting Kumwe's gauges takes more than 2 seconds."
          description: >-
            Every gauge is a bounded index probe, so a slow scrape means the database is slow for everyone, or a
            probe lost its index. The scrape will time out before the application does.
          runbook: docs/operations/runbooks.md#kumwemetricsscrapeslow
          caught: >-
            A dropped index after a manual schema repair, which turned one gauge into a full table scan that
            timed out every scrape and blanked the dashboards during the incident it was needed for.
