name: Kumwe security

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0
  SYFT_IMAGE: anchore/syft:v1.33.0
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  source-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Require reproducible dependencies
        run: test -f composer.lock

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: ctype, fileinfo, filter, intl, json, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate and audit dependencies
        run: |
          composer validate --strict
          composer audit --locked --abandoned=fail
          composer architecture:policy

      - name: Scan repository for secrets
        shell: bash
        run: |
          install -d build/security
          set +e
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/build/security:/report" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" \
            detect --source=/repo --no-banner --redact \
            --report-format json --report-path /report/gitleaks.json
          scan_status=$?
          set -e

          if test -s build/security/gitleaks.json; then
            jq '[.[] | {RuleID, File, StartLine, Fingerprint}]' \
              build/security/gitleaks.json
          fi

          exit "$scan_status"

      - name: Scan filesystem dependencies and configuration
        run: >-
          docker run --rm
          --volume "$PWD:/src:ro"
          "$TRIVY_IMAGE"
          filesystem --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --scanners vuln,misconfig,secret /src

      - name: Build production runtime image
        run: >-
          docker build
          --file docker/php/Dockerfile
          --target runtime
          --tag kumwe-security:${GITHUB_SHA}
          --build-arg KUMWE_RELEASE=2.0.0-security-scan
          .

      - name: Scan production runtime image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          "$TRIVY_IMAGE"
          image --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL kumwe-security:${GITHUB_SHA}

      - name: Generate source SBOM
        run: |
          install -d build/security
          docker run --rm --volume "$PWD:/src:ro" "$SYFT_IMAGE" \
            dir:/src -o cyclonedx-json > build/security/kumwe-source.cdx.json

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-evidence-${{ github.sha }}
          path: build/security
          if-no-files-found: error
          retention-days: 14
