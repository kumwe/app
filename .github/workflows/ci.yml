name: Kumwe 2.0 CI

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kumwe_test
          POSTGRES_USER: kumwe
          POSTGRES_PASSWORD: kumwe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kumwe -d kumwe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: https://kumwe.test
      APP_TRUSTED_HOSTS: kumwe.test
      APP_SECRET: test-only-secret-that-is-never-used-in-production
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: kumwe_test
      DB_USER: kumwe
      DB_PASSWORD: kumwe_test
      DB_SCHEMA: kumwe
      DB_SSLMODE: disable
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, fileinfo, filter, intl, json, mbstring, openssl, pdo, pdo_pgsql, sodium, zip
          coverage: xdebug
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify dependency and source policy
        run: composer architecture:policy

      - name: Audit locked dependencies
        run: composer audit --locked --abandoned=fail

      - name: Coding standard
        run: composer cs

      - name: Static analysis
        run: composer analyse

      - name: Test
        run: composer test -- --coverage-clover=build/coverage.xml

      - name: Exercise backup and restore
        if: matrix.php == '8.4'
        env:
          KUMWE_BACKUP_CONSISTENCY: quiesced
          KUMWE_BACKUP_DIR: ${{ runner.temp }}/kumwe-backups
          KUMWE_DB_HOST: 127.0.0.1
          KUMWE_DB_NAME: kumwe_test
          KUMWE_DB_PORT: 5432
          KUMWE_DB_SCHEMA: kumwe
          KUMWE_DB_USER: kumwe
          KUMWE_EXTENSIONS_DIR: ${{ github.workspace }}/extensions
          KUMWE_MEDIA_DIR: ${{ runner.temp }}/kumwe-media-source
          KUMWE_RELEASE: 2.0.0
          KUMWE_RESTORE_DB_HOST: 127.0.0.1
          KUMWE_RESTORE_DB_NAME: kumwe_restore_test
          KUMWE_RESTORE_DB_PORT: 5432
          KUMWE_RESTORE_DB_SCHEMA: kumwe
          KUMWE_RESTORE_DB_USER: kumwe
          KUMWE_RESTORE_EXTENSIONS_DIR: ${{ runner.temp }}/restored/extensions
          KUMWE_RESTORE_MEDIA_DIR: ${{ runner.temp }}/restored/media
        run: |
          pgdg_key="${RUNNER_TEMP}/postgresql-pgdg.asc"
          curl --fail --location --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output "$pgdg_key"
          test "$(gpg --show-keys --with-colons "$pgdg_key" | awk -F: '$1 == "fpr" {print $10; exit}')" \
            = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo gpg --dearmor --batch --yes \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg \
            "$pgdg_key"
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' \
            "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes jq postgresql-client-17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.'
          pg_restore --version | grep -Eq '^pg_restore \(PostgreSQL\) 17\.'
          install -d -m 0700 "$KUMWE_BACKUP_DIR" "$KUMWE_MEDIA_DIR" "${KUMWE_RESTORE_MEDIA_DIR%/media}"
          install -m 0600 /dev/null "${RUNNER_TEMP}/kumwe-db-password"
          printf '%s' "$DB_PASSWORD" > "${RUNNER_TEMP}/kumwe-db-password"
          export KUMWE_DB_PASSWORD_FILE="${RUNNER_TEMP}/kumwe-db-password"
          backup_path="$(tools/backup.sh)"
          PGPASSWORD="$DB_PASSWORD" createdb --host="$KUMWE_RESTORE_DB_HOST" --port="$KUMWE_RESTORE_DB_PORT" --username="$KUMWE_RESTORE_DB_USER" "$KUMWE_RESTORE_DB_NAME"
          export KUMWE_RESTORE_DB_PASSWORD_FILE="${RUNNER_TEMP}/kumwe-db-password"
          tools/restore.sh "$backup_path"
          test -d "$KUMWE_RESTORE_MEDIA_DIR"
          test -d "$KUMWE_RESTORE_EXTENSIONS_DIR"
          PGPASSWORD="$DB_PASSWORD" psql --host="$KUMWE_RESTORE_DB_HOST" --port="$KUMWE_RESTORE_DB_PORT" --username="$KUMWE_RESTORE_DB_USER" --dbname="$KUMWE_RESTORE_DB_NAME" --no-align --tuples-only --command="SELECT version FROM kumwe.schema_migrations WHERE version = '20260804000800_create_application_runtime'" | grep -qx '20260804000800_create_application_runtime'

      - name: Upload generated dependency lock
        if: always() && matrix.php == '8.4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 3
