name: Kumwe 2.0 CI

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kumwe_test
          POSTGRES_USER: kumwe
          POSTGRES_PASSWORD: kumwe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kumwe -d kumwe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: https://kumwe.test
      APP_TRUSTED_HOSTS: kumwe.test
      APP_SECRET: test-only-secret-that-is-never-used-in-production
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: kumwe_test
      DB_USER: kumwe
      DB_PASSWORD: kumwe_test
      DB_SCHEMA: kumwe
      DB_SSLMODE: disable
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, fileinfo, filter, intl, json, mbstring, openssl, pdo, pdo_pgsql, sodium
          coverage: xdebug
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify dependency and source policy
        run: composer architecture:policy

      - name: Audit locked dependencies
        run: composer audit --locked --abandoned=fail

      - name: Coding standard
        run: composer cs

      - name: Static analysis
        run: composer analyse

      - name: Test
        run: composer test -- --coverage-clover=build/coverage.xml

      - name: Upload generated dependency lock
        if: always() && matrix.php == '8.4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 3
