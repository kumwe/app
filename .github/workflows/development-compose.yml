name: Development Compose acceptance

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-compose:
    name: Fresh install, custom port, readiness and assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure a custom local listener
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^KUMWE_HTTP_PORT=8080$/KUMWE_HTTP_PORT=9900/' .env
          printf 'KUMWE_UID=%s\nKUMWE_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
          docker compose config --quiet

      - name: Install locked dependencies through the documented container
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm app composer install --no-interaction --prefer-dist
          git diff --exit-code -- composer.json composer.lock

      - name: Verify the custom port drives the application base URL
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose run --rm --no-deps app php -r 'echo getenv("APP_BASE_URL");')" \
            = 'http://localhost:9900'

      - name: Migrate a fresh development database
        run: docker compose run --rm app php bin/kumwe database:migrate

      - name: Start the documented development topology
        run: docker compose up -d --wait --wait-timeout 180

      - name: Verify the custom port, readiness and compiled assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose port app 8080)" = '127.0.0.1:9900'
          test "$(curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:9900/health/ready)" = '{"status":"ready"}'

          administrator_css="$(jq -er '."assets/administrator/main.ts".css[0]' \
            public/assets/build/.vite/manifest.json)"
          site_css="$(jq -er '."assets/site/main.ts".css[0]' \
            public/assets/build/.vite/manifest.json)"
          administrator_module="$(jq -er '."assets/administrator/main.ts".file' \
            public/assets/build/.vite/manifest.json)"
          evidence="$RUNNER_TEMP/development-compose-evidence"
          install -d "$evidence"

          curl --fail --silent --show-error \
            --output "$evidence/administrator.css" \
            "http://127.0.0.1:9900/assets/build/${administrator_css}"
          curl --fail --silent --show-error \
            --output "$evidence/site.css" \
            "http://127.0.0.1:9900/assets/build/${site_css}"
          curl --fail --silent --show-error \
            --output "$evidence/default-site.css" \
            http://127.0.0.1:9900/assets/default-site.css
          curl --fail --silent --show-error \
            --output "$evidence/administrator.js" \
            "http://127.0.0.1:9900/assets/build/${administrator_module}"
          curl --fail --silent --show-error \
            --output "$evidence/administrator-login.html" \
            http://127.0.0.1:9900/administrator/login
          curl --fail --silent --show-error \
            --output "$evidence/public-home.html" \
            http://127.0.0.1:9900/

          grep -Fq -- '--kumwe-font-sans' "$evidence/administrator.css"
          grep -Fq -- '--site-font' "$evidence/site.css"
          grep -Fq -- '.welcome-hero-grid' "$evidence/default-site.css"
          test "$(wc -c < "$evidence/administrator.js")" -gt 1000
          grep -Fq "/assets/build/${administrator_css}" "$evidence/administrator-login.html"
          grep -Fq '/assets/default-site.css' "$evidence/public-home.html"
          grep -Fq 'Content systems' "$evidence/public-home.html"

          # Readiness markers expire after 30 seconds. This proves that the
          # managed development watcher keeps readiness valid after startup.
          sleep 35
          test "$(curl --fail --silent --show-error \
            http://127.0.0.1:9900/health/ready)" = '{"status":"ready"}'

      - name: Show service logs
        if: always()
        run: docker compose logs --no-color app database redis

      - name: Remove the acceptance topology
        if: always()
        run: docker compose down --volumes --remove-orphans
