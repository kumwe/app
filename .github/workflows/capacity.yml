name: Kumwe sampled capacity

on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:
    inputs:
      samples:
        description: Measured attempts per worker per repeat (1–1000)
        type: number
        default: 100
      workers:
        description: Distinct worker counts (1–16 each)
        type: string
        default: '1,2,4,8'
      repeats:
        description: Repeated batches (2–10)
        type: number
        default: 5
      dataset_records:
        description: Aged records seeded per workload before the aged sample (0–200000)
        type: number
        default: 2000

permissions:
  contents: read

concurrency:
  group: capacity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samples:
    name: Concurrent samples / ${{ matrix.database.driver }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database:
          - driver: mariadb
            image: mariadb:lts
            port: 3306
            version: mariadb-12.3.2
            health: >-
              --health-cmd "healthcheck.sh --connect --innodb_initialized"
              --health-interval 5s --health-timeout 5s --health-retries 20
          - driver: mysql
            image: mysql:8.4
            port: 3306
            version: '8.4'
            health: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -ukumwe -pkumwe_test"
              --health-interval 5s --health-timeout 5s --health-retries 20
          - driver: pgsql
            image: postgres:17-alpine
            port: 5432
            version: '17'
            health: >-
              --health-cmd "pg_isready -U kumwe -d kumwe_test"
              --health-interval 5s --health-timeout 5s --health-retries 20
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_DATABASE: kumwe_test
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: kumwe_test
          MYSQL_USER: kumwe
          MYSQL_PASSWORD: kumwe_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          POSTGRES_DB: kumwe_test
          POSTGRES_USER: kumwe
          POSTGRES_PASSWORD: kumwe_test
        ports:
          - '${{ matrix.database.port }}:${{ matrix.database.port }}'
        options: ${{ matrix.database.health }}
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: https://kumwe.test
      APP_TRUSTED_HOSTS: kumwe.test
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_DRIVER: ${{ matrix.database.driver }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database.port }}
      DB_NAME: kumwe_test
      DB_USER: kumwe
      DB_PASSWORD: kumwe_test
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: ${{ matrix.database.version }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DATABASE: '0'
      REDIS_NAMESPACE: kumwe.capacity
      KUMWE_SITE_CONTENT_PROFILE: blank
      KUMWE_BUSINESS_DEMO: 'false'
      SAMPLE_COUNT: ${{ inputs.samples || 30 }}
      SAMPLE_WORKERS: ${{ inputs.workers || '1,2,4' }}
      SAMPLE_REPEATS: ${{ inputs.repeats || 3 }}
      SAMPLE_DATASET_RECORDS: ${{ inputs.dataset_records || 2000 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: ctype, fileinfo, filter, intl, json, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2
      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral application secret
        shell: bash
        run: echo "APP_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Prepare test schema
        run: |
          php tests/Support/install-parent-schema.php
          if [ "$DB_DRIVER" = mariadb ]; then php tools/agent-collation-normalize.php; fi
          php bin/kumwe database:migrate
          if [ "$DB_DRIVER" = mariadb ]; then php tools/agent-collation-normalize.php; fi
      - name: Verify statistics and worker failure handling
        run: vendor/bin/phpunit tests/Unit/Performance
      - name: Sample concurrent application commits
        shell: bash
        run: |
          php tools/perf-harness.php --concurrent --workers="$SAMPLE_WORKERS" \
            --samples="$SAMPLE_COUNT" --warmup=5 --repeats="$SAMPLE_REPEATS" --timeout=120
          mv build/perf/concurrent.json build/perf/concurrent-fresh.json
          mv build/perf/concurrent.md build/perf/concurrent-fresh.md
      - name: Sample concurrent application commits on the declared aged dataset
        shell: bash
        run: |
          php tools/perf-harness.php --concurrent --workers="$SAMPLE_WORKERS" \
            --samples="$SAMPLE_COUNT" --warmup=5 --repeats="$SAMPLE_REPEATS" --timeout=120 \
            --dataset-records="$SAMPLE_DATASET_RECORDS"
          mv build/perf/concurrent.json build/perf/concurrent-aged.json
          mv build/perf/concurrent.md build/perf/concurrent-aged.md
      - name: Measure storage, log and backup amplification per workload
        shell: bash
        run: |
          for workload in create update document aged; do
            php tools/perf-storage.php --workload="$workload" --records=200 --lines=10 \
              --dataset-records="$SAMPLE_DATASET_RECORDS" --backup
          done
      - name: Publish measured results and labelled estimates
        if: always()
        shell: bash
        run: |
          for dataset in fresh aged; do
            if [ -f "build/perf/concurrent-$dataset.md" ]; then
              { echo "### ${{ matrix.database.driver }} — $dataset dataset"; cat "build/perf/concurrent-$dataset.md"; } \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for report in build/perf/storage-*.json; do
            [ -f "$report" ] || continue
            { echo "### ${{ matrix.database.driver }} storage — $(basename "$report" .json)"; echo '```json';
              php -r '$r = json_decode(file_get_contents($argv[1]), true);
                echo json_encode(["measured" => array_diff_key($r["measured"], ["per_table" => 1]),
                  "backup" => $r["backup"]], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), "\n";' "$report";
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Retain observations and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-samples-${{ matrix.database.driver }}
          path: build/perf
          if-no-files-found: warn
          retention-days: 14
