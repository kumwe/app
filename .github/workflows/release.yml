name: Kumwe release

on:
  push:
    tags:
      - 'v2.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v2.x tag from successful merged-master CI
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SYFT_IMAGE: anchore/syft:v1.33.0
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  release:
    name: Build immutable release candidate
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      manifest: ${{ steps.candidate.outputs.manifest }}
      artifact: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      database:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: kumwe_release
          MARIADB_USER: kumwe
          MARIADB_PASSWORD: kumwe_release
          # The release lane runs the complete test suite, and the audit retention tests create and drop
          # their own database principals through tests/Support/DatabaseAdministrator, which signs in as
          # root without a password and treats a refusal as an error under CI. Every other workflow that
          # hosts this suite grants that login; a random root password here is what stopped the
          # v2.0.0-beta.1 build at `composer test` with four "Access denied for user 'root'" errors.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_BASE_URL: https://kumwe.test
      APP_TRUSTED_HOSTS: kumwe.test
      EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'true'
      DB_HOST: 127.0.0.1
      DB_DRIVER: mariadb
      DB_PORT: '3306'
      DB_NAME: kumwe_release
      DB_USER: kumwe
      DB_PASSWORD: kumwe_release
      DB_TABLE_PREFIX: kumwe_
      DB_SSLMODE: disable
      DB_SERVER_VERSION: mariadb-12.3.2
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DATABASE: 0
      REDIS_NAMESPACE: kumwe.release
      KUMWE_SITE_CONTENT_PROFILE: blank
      KUMWE_BUSINESS_DEMO: 'false'
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Node.js for release evidence
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate release identity and maintainer merge
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          bash tools/verify-release-authority.sh
          release_tag="$REQUESTED_RELEASE_TAG"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "app_image=$REGISTRY/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"
          echo "web_image=$REGISTRY/${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: apcu, ctype, fileinfo, filter, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, pdo_pgsql, redis, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Provision admitted native runtime
        uses: ./.github/actions/native-runtime

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Generate ephemeral application secret
        shell: bash
        run: echo "APP_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      # This step used to carry its own shorter list of checks — four of the thirteen the local gate runs —
      # so a release could pass while a gate a contributor runs on every change had never been executed
      # against the tag. It now executes the release lane of docs/quality/contract.json, which is the same
      # definition composer qa and this repository's other workflows are held to.
      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Verify source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-all
          composer install --no-interaction --prefer-dist --dry-run
          composer install --no-interaction --prefer-dist
          composer audit --locked --abandoned=fail
          php bin/kumwe database:migrate
          php tools/quality-contract.php --run --cadence=release 2>&1 | tee "$RUNNER_TEMP/release-source.log"
          node --test tools/release-artifacts.test.mjs tools/source-sbom.test.mjs tools/release-docs.test.mjs \
            2>&1 | tee -a "$RUNNER_TEMP/release-source.log"

      - name: Preserve release preflight failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-failure
          path: ${{ runner.temp }}/release-source.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Stamp the generated tag version into the build inputs
        env:
          KUMWE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node tools/release-artifacts.mjs stamp "$KUMWE_RELEASE_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build application candidate once
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: runtime
          pull: true
          push: true
          tags: ${{ steps.release.outputs.app_image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: KUMWE_RELEASE=${{ steps.release.outputs.version }}

      - name: Build web candidate once
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: web
          pull: true
          push: true
          tags: ${{ steps.release.outputs.web_image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: KUMWE_RELEASE=${{ steps.release.outputs.version }}

      - name: Cache Composer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-files-${{ hashFiles('composer.lock') }}
          restore-keys: composer-files-
      - name: Build release archive
        env:
          KUMWE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          KUMWE_RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          install -d dist/archive dist/package
          composer archive --format=zip --dir=dist --file="kumwe-composer-$version"
          unzip -q "dist/kumwe-composer-$version.zip" -d dist/package
          # The archive is cut from a working tree that has just run the complete test suite and holds
          # installed packages; composer.json's archive exclusions keep that state out of it. A leak is a
          # release defect rather than something to clean up quietly: a materialized extension runtime
          # map shipped inside the Composer distribution verifies under the testing signing key and
          # refuses the first migration of a fresh install as a rollback.
          if find dist/package -mindepth 1 -type f \( -path 'dist/package/storage/*' \
                  -o -path 'dist/package/extensions/*' -o -path 'dist/package/public/assets/extensions/*' \) \
                  ! -name .gitkeep -print -quit | grep -q . \
              || [ -e dist/package/vendor ] \
              || [ -e dist/package/node_modules ] \
              || [ -e dist/package/.env ]; then
              echo 'The Composer archive carries runtime state or installed packages.' >&2
              exit 1
          fi
          node tools/release-artifacts.mjs composer
          COMPOSER_ROOT_VERSION="$version" composer install \
            --working-dir=dist/package \
            --classmap-authoritative \
            --no-ansi \
            --no-dev \
            --no-interaction \
            --no-progress \
            --no-scripts \
            --prefer-dist
          if find dist/package -type l -print -quit | grep -q .; then
              echo 'Release package contains a symbolic link.' >&2
              exit 1
          fi
          if [ -e dist/package/.github ] \
              || [ -e dist/package/tests ] \
              || [ -e dist/package/docker ] \
              || [ -e dist/package/compose.yaml ]; then
              echo 'Release package contains development-only files.' >&2
              exit 1
          fi
          (
              cd dist/package
              zip -X --quiet --recurse-paths "../kumwe-app-${version}.zip" .
          )
          # The capacity contract's per-change budgets include an artifact size regression budget; the
          # ceiling lives in docs/quality/artifact-budget.json and is enforced where the archive is built.
          tools/verify-artifact-budget.sh release_archive "$(stat -c %s "dist/kumwe-app-${version}.zip")"

      - name: Generate SBOMs and scan published images
        env:
          KUMWE_APPLICATION_IMAGE: ${{ steps.release.outputs.app_image }}
          KUMWE_APPLICATION_IMAGE_DIGEST: ${{ steps.app.outputs.digest }}
          KUMWE_RELEASE_COMMIT: ${{ github.sha }}
          KUMWE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          KUMWE_WEB_IMAGE: ${{ steps.release.outputs.web_image }}
          KUMWE_WEB_IMAGE_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          app_ref='${{ steps.release.outputs.app_image }}@${{ steps.app.outputs.digest }}'
          web_ref='${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}'
          docker pull "$app_ref"
          docker pull "$web_ref"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
            "$app_ref" -o cyclonedx-json > dist/kumwe-app.cdx.json
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
            "$web_ref" -o cyclonedx-json > dist/kumwe-web.cdx.json
          docker run --rm --volume "$PWD/dist/package:/src:ro" "$SYFT_IMAGE" \
            dir:/src -o cyclonedx-json > dist/kumwe-archive.cdx.json
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$app_ref"
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$web_ref"
          rm -rf dist/package
          rm -rf dist/archive
          node tools/release-docs.mjs --build
          bash tools/source-sbom.sh dist
          node tools/create-release-manifest.mjs
          node tools/release-artifacts.mjs verify
          (
              cd dist
              sha256sum kumwe-*.cdx.json kumwe-*.zip composer-repository.json kumwe-documentation-index.json kumwe-license-*.json kumwe-release-manifest.json > SHA256SUMS
          )

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images, SBOM attestations and checksums
        shell: bash
        run: |
          set -euo pipefail
          app_ref='${{ steps.release.outputs.app_image }}@${{ steps.app.outputs.digest }}'
          web_ref='${{ steps.release.outputs.web_image }}@${{ steps.web.outputs.digest }}'
          cosign sign --yes "$app_ref" "$web_ref"
          cosign attest --yes --type cyclonedx --predicate dist/kumwe-app.cdx.json "$app_ref"
          cosign attest --yes --type cyclonedx --predicate dist/kumwe-web.cdx.json "$web_ref"
          cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS

      - name: Attest application image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.app_image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true

      - name: Attest web image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.web_image }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Attest distribution bytes and manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kumwe-app-${{ steps.release.outputs.version }}.zip
            dist/kumwe-composer-${{ steps.release.outputs.version }}.zip
            dist/composer-repository.json
            dist/kumwe-documentation-${{ steps.release.outputs.version }}.zip
            dist/kumwe-documentation-index.json
            dist/kumwe-source.cdx.json
            dist/kumwe-license-policy.json
            dist/kumwe-license-evaluation.json
            dist/kumwe-release-manifest.json

      - name: Preserve candidate identity
        id: candidate
        run: echo "manifest=$(sha256sum dist/kumwe-release-manifest.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Retain immutable candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Qualify exact release artifacts
    needs: release
    uses: ./.github/workflows/deployment-acceptance.yml
    with:
      ref: ${{ needs.release.outputs.commit }}
      release-version: ${{ needs.release.outputs.version }}
      release-artifact: ${{ needs.release.outputs.artifact }}
      release-manifest: ${{ needs.release.outputs.manifest }}

  publish:
    name: Publish qualified bytes without rebuilding
    needs: [release, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KUMWE_RELEASE_VERSION: ${{ needs.release.outputs.version }}
      KUMWE_RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/release-candidate
        with:
          artifact: ${{ needs.release.outputs.artifact }}
          manifest: ${{ needs.release.outputs.manifest }}
          version: ${{ needs.release.outputs.version }}
          commit: ${{ needs.release.outputs.commit }}
      - name: Download completed qualification receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-qualification-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: dist
          merge-multiple: true
      - name: Require every exact-byte qualification receipt
        run: node tools/release-artifacts.mjs qualify
      - name: Recheck maintainer merge and immutable publication boundary
        env:
          REQUESTED_RELEASE_TAG: v${{ needs.release.outputs.version }}
        run: |
          rm dist/release-authority.json
          bash tools/verify-release-authority.sh
      - name: Sign complete manifest and qualification checksum set
        run: |
          set -euo pipefail
          (cd dist && sha256sum kumwe-*.cdx.json kumwe-*.zip composer-repository.json kumwe-documentation-index.json kumwe-license-*.json \
            kumwe-release-manifest.json kumwe-release-qualification.json > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
      - name: Attest completed qualification evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kumwe-release-qualification.json
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Buildx for digest promotion
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote the qualified image digests
        run: bash tools/promote-release-images.sh
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KUMWE_RELEASE_VERSION" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
            channel=(--latest)
          else
            channel=(--prerelease --latest=false)
          fi
          gh release create "v$KUMWE_RELEASE_VERSION" \
            dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle \
            dist/kumwe-*.cdx.json dist/kumwe-*.zip dist/composer-repository.json dist/kumwe-documentation-index.json dist/kumwe-license-*.json \
            dist/kumwe-release-manifest.json dist/kumwe-release-qualification.json \
            --generate-notes --title "Kumwe App $KUMWE_RELEASE_VERSION" --verify-tag "${channel[@]}"
