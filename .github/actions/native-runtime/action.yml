name: Provision admitted native runtime
description: Restore or build the pinned Engine for this exact PHP ABI, then verify its identity and capabilities.
runs:
  using: composite
  steps:
    - name: Identify the native cache platform
      id: platform
      shell: bash
      run: |
        sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /usr/local/lib/kumwe-native
        php_abi="$(php -n -r 'printf("%s-%d-%d-%d", PHP_VERSION, PHP_ZTS, PHP_DEBUG, PHP_INT_SIZE);')-$(php-config --phpapi)"
        echo "abi=$php_abi-${ImageVersion:-unknown}-$(getconf GNU_LIBC_VERSION | tr ' ' '-')" >> "$GITHUB_OUTPUT"
    - name: Restore the exact native build
      id: native-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/lib/kumwe-native
        key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.abi }}-${{ hashFiles('resources/native-runtime/source.json', 'tools/install-native-engine.sh', '.github/actions/native-runtime/action.yml') }}
    - name: Install native build tools
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends autoconf build-essential cmake curl gcc-13 g++-13 pkg-config
    - name: Build and admit pinned native release
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        CC=gcc-13 CXX=g++-13 bash tools/install-native-engine.sh
    - name: Verify the native identity before every use
      shell: bash
      run: |
        php -n -d extension=/usr/local/lib/kumwe-native/kumwe_engine.so -r '
          $pin = json_decode(file_get_contents("resources/native-runtime/source.json"), true, 64, JSON_THROW_ON_ERROR);
          $expected = json_decode(file_get_contents("/usr/local/lib/kumwe-native/native-expected-tuple.json"), true, 64, JSON_THROW_ON_ERROR);
          if ($expected["extension_version"] !== $pin["binding"]["version"]
              || $expected["embedded_engine_commit"] !== $pin["engine"]["commit"]
              || $expected["embedded_source_sha256"] !== $pin["engine"]["sha256"]) {
            throw new RuntimeException("Cached native source identity differs from the reviewed pin.");
          }
          $actual = (new Kumwe\Engine\Runtime())->capabilities();
          foreach (["extension_version", "embedded_engine_commit", "embedded_source_sha256", "binding_build_digest"] as $field) {
            if ($expected[$field] !== $actual[$field]) {
              throw new RuntimeException("Native identity differs from its independent build record.");
            }
          }
          if ($expected["capabilities"] !== $actual["computation"] || $expected["binding_features"] !== $actual["binding_features"]) {
            throw new RuntimeException("Native capabilities differ from the independent build record.");
          }
        '
        native_scan="$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')"
        echo "PHP_INI_SCAN_DIR=$native_scan:/usr/local/lib/kumwe-native" >> "$GITHUB_ENV"
        echo 'KUMWE_NATIVE_EXPECTED_TUPLE=/usr/local/lib/kumwe-native/native-expected-tuple.json' >> "$GITHUB_ENV"
