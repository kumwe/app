name: Verify immutable release candidate
description: Download and verify the signed, digest-bound candidate before qualification or promotion.
inputs:
  artifact:
    required: true
    description: Candidate artifact from this workflow run and attempt
  manifest:
    required: true
    description: Expected SHA-256 of the immutable manifest
  version:
    required: true
    description: Exact release version
  commit:
    required: true
    description: Exact release commit
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: dist
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Verify candidate signature and exact bytes
      shell: bash
      env:
        EXPECTED_MANIFEST: ${{ inputs.manifest }}
        KUMWE_RELEASE_VERSION: ${{ inputs.version }}
        KUMWE_RELEASE_COMMIT: ${{ inputs.commit }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$KUMWE_RELEASE_COMMIT"
        test "$(sha256sum dist/kumwe-release-manifest.json | cut -d ' ' -f1)" = "$EXPECTED_MANIFEST"
        identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$KUMWE_RELEASE_VERSION"
        cosign verify-blob --bundle dist/SHA256SUMS.cosign.bundle \
          --certificate-identity="$identity" \
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com dist/SHA256SUMS
        (cd dist && sha256sum --strict --check SHA256SUMS)
        node tools/release-artifacts.mjs verify
