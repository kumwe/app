# Scheduled dependency updates.
#
# This file exists because of a specific, recorded incident rather than as a default: advisories have
# appeared overnight in the committed frontend lockfile, failing `npm audit --audit-level=high` on an
# unrelated pull request and blocking work that had nothing to do with the dependency. Weekly grouped
# updates make that patch routine instead of an interruption.
#
# Two rules shape every entry below. Updates are grouped so a week produces one reviewable pull request
# per ecosystem rather than a dozen, and security updates are deliberately left ungrouped so a fix for a
# published advisory is never held behind an unrelated major version bump. GitHub Actions are pinned by
# commit SHA and verified by tests/Architecture/ProductionArtifactsTest; Dependabot rewrites the SHA and
# updates the version comment beside it, so that control survives these updates rather than being
# defeated by them.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'composer'
    # Every kumwe/* library is an exact pin selected by the package release train: kumwe/extension-sdk
    # names the Producer release it was generated against, Producer names the Studio release it
    # realizes, and `composer studio:dependencies` refuses any other combination. A bump of one member
    # on its own cannot install; the set advances together through a reviewed re-pin.
    ignore:
      - dependency-name: 'kumwe/*'
    groups:
      composer-runtime:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - 'phpstan/*'
          - 'phpunit/*'
          - 'squizlabs/*'
      composer-quality-gates:
        applies-to: version-updates
        patterns:
          - 'phpstan/*'
          - 'phpunit/*'
          - 'squizlabs/*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'npm'
    # The eight @kumwe/studio* packages are one coordinated Studio release family. The App pins them
    # at the exact version kumwe/producer realizes (resources/studio-contract/PIN.json), and
    # `npm run check:studio-release` fails on any other coordinate. They move only through a deliberate
    # re-pin of the whole Studio -> Producer -> App chain, never through a version update: left to
    # itself, Dependabot offers the quarantined 0.1.0-rc.1 snapshot because semver orders an rc above
    # every beta, and that snapshot predates the APIs the administrator build imports.
    ignore:
      - dependency-name: '@kumwe/*'
    groups:
      npm-all:
        applies-to: version-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'actions'
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - '*'

  # Every shipped image — the PHP runtime, the Composer builder and the nginx web tier — is declared as
  # an ARG default in one Dockerfile, so a single directory covers all three. This is what turns a base
  # image CVE into a pull request instead of leaving it for the next release build's Trivy gate to fail.
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: 'docker'
