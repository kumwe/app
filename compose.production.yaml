name: kumwe

x-kumwe-environment: &kumwe-environment
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_BASE_URL: ${KUMWE_BASE_URL:?Set KUMWE_BASE_URL to the canonical HTTPS URL}
  APP_PUBLIC_SITE: ${KUMWE_PUBLIC_SITE:-default}
  APP_TRUSTED_HOSTS: ${KUMWE_TRUSTED_HOSTS:?Set KUMWE_TRUSTED_HOSTS}
  APP_TRUSTED_PROXIES: ${KUMWE_TRUSTED_PROXIES:-}
  APP_MAX_BODY_BYTES: ${KUMWE_MAX_BODY_BYTES:-8388608}
  APP_ADMIN_SESSION_SECONDS: ${KUMWE_ADMIN_SESSION_SECONDS:-28800}
  # Demonstration defaults: a fresh installation deploys the complete showcase.
  # KUMWE_SITE_CONTENT_PROFILE selects the managed site content installed on first
  # migrate, discovered from resources/demo/content — this release ships
  # `documentation` (the full 27-page site across all six layouts, the default),
  # `placeholder` (one welcome page), and `blank` (no content). A fork may drop its
  # own profile beside the shipped ones and name it here.
  KUMWE_SITE_CONTENT_PROFILE: ${KUMWE_SITE_CONTENT_PROFILE:-documentation}
  # KUMWE_BUSINESS_DEMO installs the released VDM business demonstration by default:
  # twelve definitions, eighty records across six client companies, workflows, and
  # portal-scoped access policies. Set `false` to install no business data, or set
  # KUMWE_BUSINESS_PROFILE to a named dataset discovered from resources/demo/business
  # (it wins over this boolean when present). Demonstration staff and client portal
  # sign-ins are provisioned by the installer or tools/production-demo.sh (default on,
  # opt out with KUMWE_DEMO_ACCESS=false); passwords are generated at provisioning
  # time and written once to a credentials file outside the repository.
  KUMWE_BUSINESS_DEMO: '${KUMWE_BUSINESS_DEMO:-true}'
  KUMWE_RELEASE: ${KUMWE_RELEASE:?Set KUMWE_RELEASE to the deployed 2.x release}
  KUMWE_DEPLOYMENT_ID: ${KUMWE_DEPLOYMENT_ID:?Set a stable deployment identifier}
  KUMWE_REPLICA_ID: ${KUMWE_REPLICA_ID:?Set a stable replica identifier unique when scaled}
  # Entrypoint defaults this to the unique container hostname; schedulers may inject a pod UID.
  KUMWE_INSTANCE_ID: ${KUMWE_INSTANCE_ID:-}
  # Log verbosity is deliberately independent of APP_DEBUG, which also widens the detail a 500
  # response discloses. Empty takes the level config/observability.php declares.
  KUMWE_LOG_LEVEL: ${KUMWE_LOG_LEVEL:-}
  # The Prometheus exposition on /metrics ships off and answers 404 until a deployment turns it on.
  # An enabled, non-public endpoint also needs KUMWE_METRICS_TOKEN_FILE mounted as a secret, or it
  # stays invisible rather than becoming open. See docs/operations/monitoring.md#metrics.
  KUMWE_METRICS_ENABLED: ${KUMWE_METRICS_ENABLED:-false}
  EXTENSION_RUNTIME_SIGNING_KEY_ID: ${KUMWE_RUNTIME_SIGNING_KEY_ID:-runtime-v1}
  EXTENSION_RUNTIME_SIGNING_KEY_FILE: /run/secrets/runtime_signing_key
  EXTENSION_RUNTIME_PREVIOUS_KEYS_FILE: /run/secrets/runtime_previous_keys
  # Both settings are also enforced at boot: a production process refuses to start with unsigned local
  # packages allowed, or with install-time conformance scanning turned off. They are spelled here so the
  # posture is visible in the deployment file rather than only in the failure message.
  EXTENSIONS_ALLOW_UNSIGNED_LOCAL: 'false'
  EXTENSIONS_CONFORMANCE_ADMISSION: ${KUMWE_CONFORMANCE_ADMISSION:-enforce}
  EXTENSIONS_REVOCATION_FEED_URL: ${KUMWE_REVOCATION_FEED_URL:-}
  EXTENSIONS_REVOCATION_FEED_KEY: ${KUMWE_REVOCATION_FEED_KEY:-}
  APP_SECRET_FILE: /run/secrets/app_secret
  DB_DRIVER: ${KUMWE_DB_DRIVER:-mariadb}
  DB_HOST: database
  DB_PORT: ${KUMWE_DB_PORT:-3306}
  DB_NAME: ${KUMWE_DB_NAME:-kumwe}
  DB_USER: ${KUMWE_DB_USER:-kumwe}
  DB_PASSWORD_FILE: /run/secrets/db_password
  DB_TABLE_PREFIX: ${KUMWE_DB_TABLE_PREFIX:-kumwe_}
  DB_SSLMODE: ${KUMWE_DB_SSLMODE:-disable}
  DB_SERVER_VERSION: ${KUMWE_DB_SERVER_VERSION:-mariadb-12.3.2}
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD_FILE: /run/secrets/redis_password

x-kumwe-runtime: &kumwe-runtime
  image: ${KUMWE_APP_IMAGE_REF:-ghcr.io/kumwe/cms/app:latest}
  pull_policy: ${KUMWE_APPLICATION_PULL_POLICY:-always}
  # Compose file-backed secrets preserve host ownership. Bootstrap as root only
  # long enough to read them, then every PHP process—including the FPM master—
  # drops to www-data before application code runs.
  user: '0:0'
  environment: *kumwe-environment
  secrets:
    - app_secret
    - runtime_signing_key
    - runtime_previous_keys
    - db_password
    - redis_password
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - DAC_READ_SEARCH
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  init: true
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    - /run:rw,noexec,nosuid,nodev,size=16m,mode=755
    - /var/www/kumwe/storage/cache:rw,noexec,nosuid,nodev,size=64m,mode=700,uid=82,gid=82
    - /var/www/kumwe/storage/logs:rw,noexec,nosuid,nodev,size=16m,mode=700,uid=82,gid=82
    - /var/www/kumwe/storage/sessions:rw,noexec,nosuid,nodev,size=32m,mode=700,uid=82,gid=82
    - /var/www/kumwe/storage/tmp:rw,noexec,nosuid,nodev,size=64m,mode=700,uid=82,gid=82
  volumes:
    - media-data:/var/www/kumwe/storage/media
    - private-data:/var/www/kumwe/storage/private
    - extensions-data:/var/www/kumwe/extensions
    - extension-assets-data:/var/www/kumwe/public/assets/extensions
  networks:
    - backend
  restart: unless-stopped

services:
  web:
    image: ${KUMWE_WEB_IMAGE_REF:-ghcr.io/kumwe/cms/web:latest}
    pull_policy: ${KUMWE_APPLICATION_PULL_POLICY:-always}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - ${KUMWE_HTTP_BIND:-127.0.0.1}:${KUMWE_HTTP_PORT:-8080}:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - frontend
    volumes:
      - extension-assets-data:/var/www/kumwe/public/assets/extensions:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=-, http://127.0.0.1:8080/health/live]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    <<: *kumwe-runtime
    environment:
      <<: *kumwe-environment
      KUMWE_PROCESS_ID: app-runtime
    command: [php-fpm, -F]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    healthcheck:
      test: [CMD, /usr/local/bin/kumwe-entrypoint, php, bin/kumwe, app:health]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  worker:
    <<: *kumwe-runtime
    environment:
      <<: *kumwe-environment
      KUMWE_PROCESS_ID: queue-worker
    profiles: [automation]
    command: [php, bin/kumwe, queue:work]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /usr/local/bin/kumwe-entrypoint, php, bin/kumwe, app:health]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *kumwe-runtime
    environment:
      <<: *kumwe-environment
      KUMWE_PROCESS_ID: scheduler
    profiles: [automation]
    command: [php, bin/kumwe, schedule:run, --loop]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /usr/local/bin/kumwe-entrypoint, php, bin/kumwe, app:health]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  migrate:
    <<: *kumwe-runtime
    environment:
      <<: *kumwe-environment
      KUMWE_PROCESS_ID: migration
    command: [php, bin/kumwe, database:migrate]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

  database:
    image: ${KUMWE_DATABASE_IMAGE:-mariadb:lts}
    pull_policy: ${KUMWE_INFRASTRUCTURE_PULL_POLICY:-always}
    environment:
      DB_DRIVER: ${KUMWE_DB_DRIVER:-mariadb}
      MARIADB_DATABASE: ${KUMWE_DB_NAME:-kumwe}
      MARIADB_USER: ${KUMWE_DB_USER:-kumwe}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: ${KUMWE_DB_NAME:-kumwe}
      MYSQL_USER: ${KUMWE_DB_USER:-kumwe}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      POSTGRES_DB: ${KUMWE_DB_NAME:-kumwe}
      POSTGRES_USER: ${KUMWE_DB_USER:-kumwe}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - db_password
    volumes:
      - database-mysql-data:/var/lib/mysql
      - database-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${DB_DRIVER}" = pgsql ]; then
            pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}";
          elif command -v healthcheck.sh >/dev/null 2>&1; then
            healthcheck.sh --connect --innodb_initialized;
          elif command -v mariadb-admin >/dev/null 2>&1; then
            mariadb-admin ping --silent -h 127.0.0.1 -u"$${MARIADB_USER}" -p"$$(cat /run/secrets/db_password)";
          else
            mysqladmin ping --silent -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$$(cat /run/secrets/db_password)";
          fi
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: ${KUMWE_REDIS_IMAGE:-redis:8-alpine}
    pull_policy: ${KUMWE_INFRASTRUCTURE_PULL_POLICY:-always}
    # Read the protected file-backed secret, then run Redis as its service user.
    user: '0:0'
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        redis_password="$$(cat /run/secrets/redis_password)"
        test -n "$${redis_password}"
        case "$${redis_password}" in
          *[!A-Za-z0-9+/=_-]*)
            echo 'Redis password must be a base64-compatible token.' >&2
            exit 78
            ;;
        esac
        printf '%s\n' \
          'bind 0.0.0.0 ::0' \
          'protected-mode yes' \
          'appendonly yes' \
          'appendfsync everysec' \
          "requirepass $${redis_password}" \
          > /run/redis/redis.conf
        chmod 0700 /run/redis
        chmod 0600 /run/redis/redis.conf
        chown redis:redis /run/redis /run/redis/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /run/redis/redis.conf
    secrets:
      - redis_password
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/redis:rw,noexec,nosuid,nodev,size=1m,mode=700
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -qx PONG'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

secrets:
  app_secret:
    file: ${KUMWE_APP_SECRET_FILE:?Set KUMWE_APP_SECRET_FILE}
  runtime_signing_key:
    file: ${KUMWE_RUNTIME_SIGNING_KEY_FILE:?Set KUMWE_RUNTIME_SIGNING_KEY_FILE}
  runtime_previous_keys:
    file: ${KUMWE_RUNTIME_PREVIOUS_KEYS_FILE:?Set KUMWE_RUNTIME_PREVIOUS_KEYS_FILE to a JSON key-ring file (use {})}
  db_password:
    file: ${KUMWE_DB_PASSWORD_FILE:?Set KUMWE_DB_PASSWORD_FILE}
  redis_password:
    file: ${KUMWE_REDIS_PASSWORD_FILE:?Set KUMWE_REDIS_PASSWORD_FILE}

volumes:
  extension-assets-data:
  extensions-data:
  media-data:
  private-data:
  database-mysql-data:
  database-postgres-data:
  redis-data:

networks:
  frontend:
  backend:
    internal: true
